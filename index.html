const ACT = new Map();

// ------------------------------------------------------------
// atores
// ------------------------------------------------------------
function newActor(kind, m, x, y) {
  const a = { id: G.nextId++, kind, map: m.id, x, y, fx: x, fy: y, rx: x, ry: y, mt: 1, mdur: 300, dir: 0, face: 1, hp: 1, maxHp: 1, dead: false,
    flash: 0, slowUntil: 0, stunUntil: 0, dots: [], buffs: {}, nextMove: 0, nextAtk: 0, anim: Math.random() * 1000 };
  ACT.set(a.id, a);
  m.occ[m.idx(x, y)] = a.id;
  return a;
}
function freeNear(m, x, y, r, noPz) {
  if (m.inb(x, y) && m.free(x, y) && !(noPz && m.pz[m.idx(x, y)])) return { x, y };
  for (let d = 1; d <= r; d++) {
    const c = [];
    for (let j = -d; j <= d; j++) for (let i = -d; i <= d; i++) if (Math.max(Math.abs(i), Math.abs(j)) === d) c.push([x + i, y + j]);
    for (let k = c.length - 1; k > 0; k--) { const q = Math.floor(Math.random() * (k + 1)); [c[k], c[q]] = [c[q], c[k]]; }
    for (const [tx, ty] of c) if (m.inb(tx, ty) && m.free(tx, ty) && !m.warps.has(m.idx(tx, ty)) && !(noPz && m.pz[m.idx(tx, ty)])) return { x: tx, y: ty };
  }
  return null;
}
function actorAt(m, x, y) { if (!m.inb(x, y)) return null; const id = m.occ[m.idx(x, y)]; return id ? ACT.get(id) : null; }
function monSprite(d) {
  if (!d._spr) d._spr = d.look.b ? beastSprites(d.look.b) : charSprites(d.look.h.look, d.look.h.gear, d.look.h.feat);
  return d._spr;
}
function spawnMonster(m, defId, x, y, o) {
  o = o || {};
  const d = MON[defId];
  if (!d) return null;
  const pos = freeNear(m, x, y, o.r || 4, true);
  if (!pos) return null;
  const a = newActor('mon', m, pos.x, pos.y);
  a.def = d; a.hp = a.maxHp = d.hp; a.home = { x: pos.x, y: pos.y }; a.spawn = o.spawn || null;
  a.ab = d.ab.map((b) => Object.assign({}, b, { next: 0 }));
  a.boss = !!d.boss; a.ally = !!d.ally; a.summoned = !!o.summoned; a.master = o.master || null; a.minions = [];
  a.dmg = d.dmg; a.face = Math.random() < 0.5 ? -1 : 1;
  m.mons.push(a);
  return a;
}
function spawnNPC(m, np) {
  const def = NPCS[np.id];
  if (!def) return;
  const pos = freeNear(m, np.x, np.y, 2);
  if (!pos) return;
  const a = newActor('npc', m, pos.x, pos.y);
  a.npc = np.id; a.def = def; a.home = { x: pos.x, y: pos.y }; a.town = np.town; a.hp = a.maxHp = 1;
  a.spr = charSprites(def.look, def.gear || {}, def.feat || {});
  m.npcActs = m.npcActs || [];
  m.npcActs.push(a);
}
function removeActor(a) {
  const m = G.maps[a.map];
  if (m) { const i = m.idx(a.x, a.y); if (m.occ[i] === a.id) m.occ[i] = 0; }
  ACT.delete(a.id);
}
function stepActor(a, dx, dy, dur) {
  const m = G.maps[a.map];
  const i0 = m.idx(a.x, a.y);
  if (m.occ[i0] === a.id) m.occ[i0] = 0;
  a.fx = a.x; a.fy = a.y; a.x += dx; a.y += dy; a.mt = 0; a.mdur = dur || 400;
  m.occ[m.idx(a.x, a.y)] = a.id;
  if (dx || dy) a.dir = dirFromDelta(dx, dy);
  if (dx) a.face = dx < 0 ? -1 : 1;

function questKill(mid) {
  const p = G.p;
  for (const qid in p.quests) {
    const q = p.quests[qid], Q = QUESTS[qid];
    if (q.st !== 'active' || Q.obj.k !== 'kill' || !Q.obj.m.includes(mid)) continue;
    if (q.c < Q.obj.n) { q.c++; if (q.c >= Q.obj.n) { notice('Missão concluída: ' + Q.n + '. Fale com ' + NPCS[Q.npc].n + '.', '#ffe066'); sfx('quest'); } }
    G.dirty.quests = 1;
  }
  const t = p.tasks[mid];
  if (t && t.c < TASKS[mid].n) {
    t.c++;
    if (t.c >= TASKS[mid].n) { notice('Contrato completo: ' + MON[mid].name + '. Volte ao mestre de caça.', '#ffe066'); sfx('quest'); }
    G.dirty.quests = 1;
  }
}
function questState(qid) { const q = G.p.quests[qid]; return q ? q.st : null; }
function questAvailable(Q) {
  const p = G.p;
  if (p.quests[Q.id]) return false;
  if (Q.pre && questState(Q.pre) !== 'done') return false;
  return p.lvl >= Q.lvl;
}
function questReady(qid) {
  const p = G.p, q = p.quests[qid], Q = QUESTS[qid];
  if (!q || q.st !== 'active') return false;
  if (Q.obj.k === 'kill' || Q.obj.k === 'fish') return q.c >= Q.obj.n;
  return countItem(p, Q.obj.i) >= Q.obj.n;
}
function questProgress(qid) {
  const p = G.p, q = p.quests[qid], Q = QUESTS[qid];
  if (Q.obj.k === 'kill' || Q.obj.k === 'fish') return Math.min(q.c, Q.obj.n) + '/' + Q.obj.n;
  return Math.min(countItem(p, Q.obj.i), Q.obj.n) + '/' + Q.obj.n;
}
function acceptQuest(qid) {
  G.p.quests[qid] = { st: 'active', c: 0 };
  log('Nova missão: ' + QUESTS[qid].n + '.', 'quest');
  sfx('quest');
  G.dirty.quests = 1; G.saveDirty = true;
}
function completeQuest(qid) {
  const p = G.p, Q = QUESTS[qid];
  if (!questReady(qid)) return false;
  if (Q.obj.k === 'item') removeItem(p, Q.obj.i, Q.obj.n);
  p.quests[qid].st = 'done';
  const R = Q.rew, got = [];
  p.gold += R.gold || 0;
  for (const [id, n] of R.items || []) { const it = makeItem(id, 0, n); if (!addToBag(p, it)) dropItem(p, it); got.push(makeItem(id, 0, n)); }
  if (R.gear) { const it = randomEquip(Math.max(p.lvl, Q.lvl), Math.max(R.gear, rollRarity(R.gear, p.st.mf)), p.voc); if (!addToBag(p, it)) dropItem(p, it); got.push(it); }
  lootMsg(got, R.gold);
  log('Missão concluída: ' + Q.n + '!', 'quest');
  sfx('lvl');
  gainXp(R.xp || 0);
  G.dirty.quests = 1; G.dirty.gold = 1; G.saveDirty = true;

}
function tasksFor() {

    .sort((a, b) => MON[a.m].lvl - MON[b.m].lvl).slice(0, 10);

function acceptTask(mid) {

const KEYS = {};

function inputDir() {
  let dx = 0, dy = 0;
  for (const k in KEYS) if (KEYS[k] && KEYDIR[k]) { dx += KEYDIR[k][0]; dy += KEYDIR[k][1]; }
  if (G.touchDir) { dx += G.touchDir[0]; dy += G.touchDir[1]; }
  dx = clamp(dx, -1, 1); dy = clamp(dy, -1, 1);

const R = { cv: null, g: null, S: 3, W: 0, H: 0, dpr: 1, light: null, lg: null, camPX: 0, camPY: 0, wx: [], wxType: null };
const FONT = '"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif';
function initRender() {
  R.cv = $('#cv'); R.g = R.cv.getContext('2d');

  window.addEventListener('resize', resize);

function resize() {

  R.dpr = Math.min(2, window.devicePixelRatio || 1);
  R.W = Math.max(64, Math.floor(box.width * R.dpr)); R.H = Math.max(64, Math.floor(box.height * R.dpr));
  R.cv.width = R.W; R.cv.height = R.H;
  const tileCss = clamp(Math.round(Math.min(box.width / 19, box.height / 12.5)), 30, 66);
  R.S = Math.max(2, Math.floor((tileCss * R.dpr) / 16 + 0.25));

}
const OOB_EXTRA = { praca: 'GRASS', doce: 'W_CANDY', cristal: 'W_CRYS', vazio: 'STARSEA' };
function oob(m) { if (OOB_EXTRA[m.id]) return T[OOB_EXTRA[m.id]]; return m.id === 'ov' ? T.DEEP : m.sky ? T.SKY : (DUNGEONS[m.id] ? DUNGEONS[m.id].wall : m.id === 'abismo' ? T.W_HELL : T.VOID); }
function tileAtR(m, x, y, ob) { return m.inb(x, y) ? m.t[y * m.w + x] : ob; }
function screenToWorld(px, py) {

}
function drawText(g, s, x, y, col, size, align) {

  g.textAlign = align || 'center'; g.textBaseline = 'alphabetic';
  g.lineJoin = 'round'; g.lineWidth = Math.max(2, size / 3.6); g.strokeStyle = 'rgba(10,6,14,0.92)';

const corpseCache = new Map();
function flipV(c) { const o = mkCanvas(c.width, c.height), g = o.getContext('2d'); g.translate(0, c.height); g.scale(1, -1); g.drawImage(c, 0, 0); return o; }
function corpseSprite(d) {

  const pile = d.look.b && ['elem', 'ghost'].includes(d.look.b.t);
  const bc = BLOODC[d.blood] || BLOODC.red;

    c = spr(16, 16, (P) => { P.r(3, 10, 10, 4, bc[1]); P.r(5, 8, 6, 2, bc[0]); P.r(4, 11, 3, 2, bc[0]); P.p(9, 9, '#ffffff'); P.p(6, 12, bc[0]); });
  } else {

    if (d.blood === 'red' || d.blood === 'green') {

      g.fillRect(Math.round(w * 0.15), h - 6, Math.round(w * 0.7), 4); g.fillRect(Math.round(w * 0.25), h - 7, Math.round(w * 0.5), 6);

}
function darknessNow(m) {

function render() {
  const g = R.g, S = R.S, T16 = 16 * S, m = G.map;
  if (!m) return;
  g.imageSmoothingEnabled = false;
  const p = G.started ? G.p : null;
  let cx, cy;
  if (p) { cx = p.rx + 0.5; cy = p.ry + 0.5; } else { cx = G.titleCam.x; cy = G.titleCam.y; }
  let sx = 0, sy = 0;
  if (G.shake > 0.2 && G.opt.shake) { sx = rndf(-1, 1) * G.shake * 0.05; sy = rndf(-1, 1) * G.shake * 0.05; }
  const vw = R.W / T16, vh = R.H / T16;

      const v = m.inb(x, y) ? m.v[y * m.w + x] : (x * 7 + y * 13) & 255;
      if (t === T.SKY) continue;
      if (def.wall && def.top) {
        const below = TILE[tileAtR(m, x, y + 1, OB)];
        const sp = below && below.wall ? def.top[v % def.top.length] : def.fc[v % def.fc.length];
        g.drawImage(sp, dx, dy, T16, T16);

      const sp = def.anim ? def.spr[(Math.floor(now / 430) + (def.sync ? 0 : (x * 7 + y * 3) % 3)) % def.spr.length] : def.spr[v % def.spr.length];

const ZONEMOOD = { 1: 'vale', 2: 'forest', 3: 'forest', 4: 'swamp', 5: 'desert', 6: 'tundra', 7: 'fire', 10: 'dungeon', 11: 'dungeon', 12: 'dungeon', 13: 'dungeon', 14: 'desert', 15: 'dungeon',

  30: 'plaza', 31: 'candy', 32: 'candy', 33: 'crystal', 34: 'crystal', 35: 'void', 36: 'void', 37: 'candy', 38: 'crystal', 39: 'void' };

  zone(z) { const m = ZONEMOOD[z] || 'vale'; if (m !== this.mood) { this.mood = m; this.step = 0; } },

function dialogQuests(a) {
  UI.dialogView = 'quest';
  const b = openWin('npc', a.def.n);
  const qs = Object.values(QUESTS).filter((Q) => Q.npc === a.npc);
  let shown = 0;
  for (const Q of qs) {
    const st = questState(Q.id);
    if (st === 'done') continue;
    if (!st && !questAvailable(Q)) continue;
    shown++;
    const c = el('div', 'quest' + (questReady(Q.id) ? ' ready' : ''));
    c.append(el('b', null, Q.n), el('p', null, Q.d));
    const rw = [];
    if (Q.rew.xp) rw.push(fmt(Q.rew.xp) + ' XP'); if (Q.rew.gold) rw.push(fmt(Q.rew.gold) + ' de ouro');
    if (Q.rew.gear) rw.push('equipamento ' + RARITY[Q.rew.gear].n.toLowerCase() + ' ou melhor');
    for (const [id, n] of Q.rew.items || []) rw.push(n + 'x ' + ITEMS[id].name);
    c.appendChild(el('small', null, 'Recompensa: ' + rw.join(', ')));
    if (!st) c.appendChild(btn('Aceitar missão', () => { acceptQuest(Q.id); say(a, 'Conto com você!', '#f2e060', true); dialogQuests(a); }, 'pri'));
    else if (questReady(Q.id)) c.appendChild(btn('Entregar', () => { completeQuest(Q.id); say(a, Q.done || 'Obrigado!', '#f2e060'); dialogQuests(a); }, 'pri'));
    else c.appendChild(el('small', 'prog', 'Progresso: ' + questProgress(Q.id)));
    b.appendChild(c);
  }
  if (!shown) {
    const pend = qs.find((Q) => !questState(Q.id));
    b.appendChild(el('p', 'greet', pend ? (G.p.lvl < pend.lvl ? 'Volte quando for mais forte (nível ' + pend.lvl + ').' : 'Termine suas outras tarefas primeiro.') : 'Você já fez tudo o que eu precisava. Obrigado, herói!'));
    if (!pend) b.appendChild(el('p', 'hint', nextQuestHint()));
  }
  b.appendChild(btn('Voltar', () => UI.openDialog(a)));
}

  const test = (a) => {
    if (a.dead) return;

  };

}

// toque
function initTouch() {
  const t = $('#touch');
  if (!isTouch()) return;
  t.hidden = false;
  const pad = t.querySelector('.pad'), knob = pad.querySelector('i');
  let id = null, cx = 0, cy = 0;
  pad.addEventListener('pointerdown', (e) => { id = e.pointerId; pad.setPointerCapture(id); const r = pad.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; move(e); });
  const move = (e) => {
    if (e.pointerId !== id) return;
    const dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy), max = 38;
    const k = d > max ? max / d : 1;
    knob.style.transform = 'translate(' + dx * k + 'px,' + dy * k + 'px)';
    if (d < 12) { G.touchDir = null; return; }
    const a = Math.atan2(dy, dx), oct = Math.round(a / (Math.PI / 4));
    const map = { 0: [1, 0], 1: [1, 1], 2: [0, 1], 3: [-1, 1], 4: [-1, 0], '-4': [-1, 0], '-3': [-1, -1], '-2': [0, -1], '-1': [1, -1] };
    G.touchDir = map[oct] || null;
  };
  pad.addEventListener('pointermove', move);
  const up = () => { id = null; G.touchDir = null; knob.style.transform = ''; };
  pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
  t.querySelector('[data-a="target"]').addEventListener('click', () => cycleTarget());
  t.querySelector('[data-a="use"]').addEventListener('click', () => { if (FISHING.st) fishAction(); else interactNearby(); });
}

// ---- 62-trade.js ----
// ============================================================
// QUADRIA — trocas entre jogadores e anúncios da Praça das Trocas
// Os dois lados colocam itens e ouro. A troca tem duas fases:
//  1. "aceitar" (ok): pode ser desfeito; mudar a oferta desfaz;
//  2. "travar" (cf): quando cada um vê os dois aceites da MESMA oferta,
//     trava (não dá mais para mudar nem cancelar) e só conclui quando vê
//     o outro travado na mesma oferta.
// Assim ninguém recebe uma oferta que o outro mudou no último instante.
// ============================================================
const TRADE = { st: null, req: null, seenReq: new Set(), ad: '' };
const TRADE_MAX = 6, TRADE_DIST = 8;

function tradeNewId() { return 't' + Math.random().toString(36).slice(2, 10); }
function offerKey(it, g) { return codeHash(JSON.stringify([it, g | 0])); }
function dealKey(st) {
  const a = offerKey(st.mine, st.gold), b = offerKey(st.theirsRaw, st.theirs.gold);
  return NET.me < st.with ? a + ':' + b : b + ':' + a;
}
function tradeLocked() { return !!(TRADE.st && (TRADE.st.cf || TRADE.st.done)); }
// o que está "em mãos" na troca volta para o dono se o jogo fechar no meio
function tradeEscrow() {
  const st = TRADE.st;
  if (!st || st.done) return [];
  return st.mine.map((it) => ({ it })).concat(st.gold ? [{ g: st.gold }] : []);
}

// pedido e abertura

function tradeRequest(a) {
  const p = G.p;

  if (TRADE.st) return notice('Você já está numa troca.', '#ff8a6a');
  if (a.map !== p.map || cheb(a, p) > TRADE_DIST) return notice('Chegue mais perto de ' + a.name + ' para trocar (até ' + TRADE_DIST + ' passos).', '#ff8a6a');
  if (isMuted(a)) return notice('Você silenciou ' + a.name + '.', '#ff8a6a');
  TRADE.req = { to: a.peer, id: tradeNewId(), at: G.t, name: a.name };
  log('Pedido de troca enviado para ' + a.name + '. Esperando resposta...', 'party');
  sfx('click');
  netPresence();
}
function tradeOpen(id, peer, name, seen) {
  TRADE.st = { id, with: peer, name, mine: [], gold: 0, ok: '', cf: '', theirs: { items: [], gold: 0, ok: '', cf: '' }, theirsRaw: [],
    seen: !!seen, lastCf: '', openT: G.t, done: false, doneT: 0 };
  TRADE.req = null;
  closeWin('tradereq');
  log('Troca aberta com ' + name + '. Coloque itens ou ouro e aceite.', 'party');
  sfx('quest');

}
function tradeAcceptReq(q) {
  const a = G.peers.get(q.peer);
  if (!a || a.tqId !== q.id) return notice('O pedido de troca expirou.', '#c8b8a0');
  if (TRADE.st) return notice('Você já está numa troca.', '#ff8a6a');
  if (a.map !== G.p.map || cheb(a, G.p) > TRADE_DIST + 4) return notice('Vocês estão longe demais para trocar.', '#ff8a6a');
  tradeOpen(q.id, q.peer, a.name, false);
}
// devolve tudo que estava na mesa
function tradeCancel(msg, quiet) {
  const st = TRADE.st, p = G.p;
  if (!st) return;
  if (!st.done) {
    for (const it of st.mine) if (!addToBag(p, it)) { dropItem(p, it); notice('Mochila cheia: um item da troca ficou no chão.', '#ff8a6a'); }
    if (st.gold) { p.gold += st.gold; G.dirty.gold = 1; }
    G.dirty.bag = 1;
  }
  TRADE.st = null;
  syncEscrow();
  closeWin('trade');
  if (msg) { log(msg, 'party'); if (!quiet) notice(msg, '#c8b8a0'); }
  netPresence();
}
// ------------------------------------------------------------
// mexer na oferta (só antes de travar)
// ------------------------------------------------------------
function tradeEdit() {
  const st = TRADE.st;
  st.ok = '';
  syncEscrow(); sfx('equip');
  netPresence(); UI.openTrade(true);
}
function tradeAddItem(idx) {
  const st = TRADE.st, p = G.p;
  if (!st || tradeLocked()) return;
  const it = p.bag[idx];
  if (!it) return;
  if (st.mine.length >= TRADE_MAX) return notice('No máximo ' + TRADE_MAX + ' itens por troca.', '#ff8a6a');
  p.bag[idx] = null; G.dirty.bag = 1;
  st.mine.push(it);
  tradeEdit();
}
function tradeRemoveItem(i) {
  const st = TRADE.st, p = G.p;
  if (!st || tradeLocked()) return;
  const it = st.mine.splice(i, 1)[0];
  if (!it) return;
  if (!addToBag(p, it)) dropItem(p, it);
  G.dirty.bag = 1;
  tradeEdit();
}
function tradeSetGold(v) {
  const st = TRADE.st, p = G.p;
  if (!st || tradeLocked()) return;
  v = Math.max(0, Math.floor(+v || 0));
  const total = p.gold + st.gold;
  v = Math.min(v, total, 1e9);
  if (v === st.gold) return;
  p.gold = total - v; st.gold = v; G.dirty.gold = 1;
  tradeEdit();
}
function tradeFits(st) {
  const p = G.p;
  let free = bagFree(p);
  const room = {};
  for (const s of p.bag) if (s && ITEMS[s.b].stack) room[s.b] = (room[s.b] || 0) + 100 - s.n;
  for (const it of st.theirs.items) {
    if (ITEMS[it.b].stack) {
      let n = it.n - Math.min(it.n, room[it.b] || 0);
      room[it.b] = Math.max(0, (room[it.b] || 0) - it.n);
      while (n > 0) { free--; room[it.b] = (room[it.b] || 0) + 100 - Math.min(100, n); n -= 100; }
    } else free--;
  }
  return free >= 0;
}
function tradeAccept() {
  const st = TRADE.st;
  if (!st || tradeLocked()) return;
  if (!st.seen) return notice('Esperando ' + st.name + ' abrir a troca...', '#c8b8a0');
  if (!st.mine.length && !st.gold && !st.theirs.items.length && !st.theirs.gold) return notice('A troca está vazia.', '#c8b8a0');
  if (!tradeFits(st)) return notice('Libere espaço na mochila para receber os itens.', '#ff8a6a');
  st.ok = dealKey(st);
  sfx('click');
  tradeStep();
  netPresence(); UI.openTrade(true);
}
function tradeUnaccept() {
  const st = TRADE.st;
  if (!st || tradeLocked() || !st.ok) return;
  st.ok = '';
  netPresence(); UI.openTrade(true);
}
// avança as fases: trava quando os dois aceitaram a mesma oferta; conclui quando os dois travaram
function tradeStep() {
  const st = TRADE.st;
  if (!st || st.done) return;
  const k = dealKey(st), T = st.theirs;
  if (!st.cf && st.ok === k && (T.ok === k || T.cf === k)) {
    if (!tradeFits(st)) { st.ok = ''; notice('Libere espaço na mochila para receber os itens.', '#ff8a6a'); return; }
    st.cf = k;
    log('Os dois aceitaram. Confirmando a troca...', 'party');
  }
  if (st.cf && st.cf !== k) { st.cf = ''; st.ok = ''; }
  if (st.cf && T.cf === st.cf) tradeFinish();
}
function tradeFinish() {
  const st = TRADE.st, p = G.p;
  st.done = true; st.doneT = G.t;
  for (const it of st.theirs.items) if (!addToBag(p, Object.assign({}, it))) dropItem(p, Object.assign({}, it));
  if (st.theirs.gold) p.gold += st.theirs.gold;
  G.dirty.bag = 1; G.dirty.gold = 1;
  const got = st.theirs.items.map((it) => itemName(it) + (it.n > 1 ? ' x' + it.n : '')).concat(st.theirs.gold ? [fmt(st.theirs.gold) + ' de ouro'] : []);
  const gave = st.mine.map((it) => itemName(it) + (it.n > 1 ? ' x' + it.n : '')).concat(st.gold ? [fmt(st.gold) + ' de ouro'] : []);
  log('Troca concluída com ' + st.name + '. Você recebeu: ' + (got.join(', ') || 'nada') + '. Você deu: ' + (gave.join(', ') || 'nada') + '.', 'loot');
  notice('Troca concluída!', '#7fe07f');
  p.stats.trades = (p.stats.trades || 0) + 1;
  sfx('rare');
  syncEscrow();
  closeWin('trade');
  saveGame();

}
// ------------------------------------------------------------
// presença: o que este módulo publica
// ------------------------------------------------------------
function tradePresence(pres) {
  if (TRADE.req && G.t - TRADE.req.at < 30000) pres.tq = { to: TRADE.req.to, id: TRADE.req.id };
  else if (TRADE.req) { log('Ninguém respondeu ao pedido de troca.', 'party'); TRADE.req = null; }
  const st = TRADE.st;
  if (st) {
    pres.tr = { w: st.with, id: st.id, it: st.mine, g: st.gold };
    if (st.ok) pres.tr.ok = st.ok;
    if (st.cf) pres.tr.cf = st.cf;
    if (st.done) pres.tr.d = 1;
  }
  if (TRADE.ad && G.p && G.p.map === 'praca') pres.ad = TRADE.ad;
}
// presença: o que chega dos outros
function tradePeer(a, peer, q) {
  const tq = q.tq;
  a.tqId = tq && typeof tq === 'object' && tq.to === NET.me && typeof tq.id === 'string' && /^t[a-z0-9]{2,12}$/.test(tq.id) ? tq.id : null;
  if (a.tqId && G.started) {
    const key = peer + '|' + a.tqId;
    if (!TRADE.seenReq.has(key)) { TRADE.seenReq.add(key); if (!isMuted(a)) UI.tradeReq({ peer, id: a.tqId, name: a.name, lvl: a.lvl }); }
  }
  const tr = q.tr && typeof q.tr === 'object' ? q.tr : null;
  // quem pediu a troca abre quando o outro aceita
  if (TRADE.req && TRADE.req.to === peer && tr && tr.w === NET.me && tr.id === TRADE.req.id && !TRADE.st) tradeOpen(tr.id, peer, a.name, true);
  const st = TRADE.st;
  if (!st || st.with !== peer) return;
  const match = tr && tr.w === NET.me && tr.id === st.id;
  if (!match) { if (st.seen || G.t - st.openT > 20000) tradeGone(a.name); return; }
  st.seen = true;
  if (st.done) { if (tr.d) { TRADE.st = null; netPresence(); } return; }
  const raw = Array.isArray(tr.it) ? tr.it.slice(0, TRADE_MAX) : [];
  const gold = clamp(Math.floor(+tr.g || 0), 0, 1e9);
  const changed = JSON.stringify(raw) !== JSON.stringify(st.theirsRaw) || gold !== st.theirs.gold;
  st.theirsRaw = raw;
  st.theirs = { items: raw.map(safeItem).filter(Boolean), gold, ok: typeof tr.ok === 'string' ? tr.ok.slice(0, 40) : '', cf: typeof tr.cf === 'string' ? tr.cf.slice(0, 40) : '' };
  if (st.theirs.cf) st.lastCf = st.theirs.cf;
  // o outro mudou a oferta ou desistiu antes de travar: o meu aceite cai
  if (changed && st.ok && !st.cf) st.ok = '';
  if (st.cf && st.theirs.cf !== st.cf && st.theirs.ok !== st.cf) { st.cf = ''; st.ok = ''; log(a.name + ' mudou a oferta. Confira de novo.', 'party'); }
  const before = st.ok + '|' + st.cf;
  tradeStep();
  if (TRADE.st && before !== st.ok + '|' + st.cf) netPresence();
  if (TRADE.st && winOpen('trade')) UI.openTrade(true);
}
// a outra ponta sumiu: se ela já tinha travado nesta mesma oferta, ela concluiu
function tradeGone(name) {
  const st = TRADE.st;
  if (!st || st.done) return;
  if (st.cf && st.lastCf === st.cf) { tradeFinish(); return; }
  tradeCancel(st.seen ? name + ' cancelou a troca.' : name + ' não abriu a troca.');
}
function tradeTick() {
  const st = TRADE.st, p = G.p;
  if (!st) return;
  if (st.done) { if (G.t - st.doneT > 20000) { TRADE.st = null; netPresence(); } return; }
  const a = G.peers.get(st.with);
  if (!a) return tradeGone(st.name);
  if (!st.cf && (a.map !== p.map || cheb(a, p) > TRADE_DIST + 6)) return tradeCancel('Vocês se afastaram demais. A troca foi cancelada.');
  if (!st.seen && G.t - st.openT > 20000) return tradeCancel(st.name + ' não abriu a troca.');
}
function tradeLeave() {
  if (TRADE.st && !TRADE.st.done) tradeCancel('Você saiu do servidor. A troca foi cancelada.', true);
  TRADE.st = null; TRADE.req = null; TRADE.seenReq.clear();
  closeWin('tradereq');
}

// ============================================================
// QUADRIA — códigos de recompensa e o Portal Dimensional
// Códigos fixos ficam guardados só como resumo (hash); o dono do jogo
// (e editores) também criam códigos no banco compartilhado "codes".
// ============================================================
const CODEUI = { tries: [], list: [], unsub: null, on: false };

function codeFromDb(v) {
  if (!v || typeof v !== 'object') return null;
  const items = [];
  if (Array.isArray(v.items)) for (const x of v.items.slice(0, 4)) {
    if (!Array.isArray(x) || !CODE_REWARDS.includes(x[0]) || !ITEMS[x[0]]) continue;
    items.push([x[0], ITEMS[x[0]].stack ? clamp(Math.floor(+x[1] || 1), 1, 100) : 1]);
  }
  const msg = typeof v.msg === 'string' ? FILTER.check(cleanText(v.msg).slice(0, 80)) : null;
  return { gold: clamp(Math.floor(+v.gold || 0), 0, 100000), items, msg: msg && !msg.hit ? msg.text : '', lvl: clamp(v.lvl | 0, 0, 999), exp: +v.exp || 0, hint: typeof v.hint === 'string' ? cleanText(v.hint).slice(0, 8) : '' };
}
function codeRewardsText(R) {
  const parts = [];
  if (R.gold) parts.push(fmt(R.gold) + ' de ouro');
  for (const [id, n] of R.items || []) if (ITEMS[id]) parts.push((n > 1 ? n + 'x ' : '') + ITEMS[id].name);
  return parts.join(', ') || 'nada';
}
async function redeemCode(raw) {
  const p = G.p;
  if (!p) return false;
  const c = codeNorm(raw);
  if (c.length < 3) { notice('Digite um código válido.', '#ff8a6a'); return false; }
  const now = Date.now();
  CODEUI.tries = CODEUI.tries.filter((t) => now - t < 30000);
  if (CODEUI.tries.length >= 6) { notice('Muitas tentativas. Espere um pouquinho.', '#ff8a6a'); return false; }
  CODEUI.tries.push(now);
  const h = codeHash(c);
  if (!p.codes) p.codes = {};
  if (p.codes[h]) { notice('Você já usou este código.', '#c8b8a0'); return false; }
  let R = own(CODES, h) ? CODES[h] : null;
  if (!R && NET.db) {
    try {
      const snap = await Promise.race([NET.db.doc('codes/' + h).get(), new Promise((r) => setTimeout(() => r(null), 8000))]);
      if (snap && snap.exists) R = codeFromDb(snap.data());
    } catch (e) { /* sem banco */ }
  }
  if (!R) { notice('Código inválido ou expirado.', '#ff8a6a'); sfx('error'); return false; }
  if (R.exp && now > R.exp) { notice('Este código expirou.', '#ff8a6a'); return false; }
  if (R.lvl && p.lvl < R.lvl) { notice('Este código exige nível ' + R.lvl + '.', '#ff8a6a'); return false; }
  const need = (R.items || []).filter(([id]) => !ITEMS[id].stack || !p.bag.some((s) => s && s.b === id)).length;
  if (bagFree(p) < need) { notice('Libere ' + need + ' espaço(s) na mochila para resgatar.', '#ff8a6a'); return false; }
  p.codes[h] = now;
  if (R.gold) p.gold += R.gold;
  for (const [id, n] of R.items || []) { const it = makeItem(id, 0, n); if (!addToBag(p, it)) dropItem(p, it); }
  log('Código resgatado! ' + (R.msg ? R.msg + ' ' : '') + 'Você ganhou: ' + codeRewardsText(R) + '.', 'quest');
  notice('Código resgatado!', '#ffe066');
  burst(p.rx + 0.5, p.ry + 0.2, ['#ffe066', '#ffffff', '#cfa6ff', '#6ff0ff'], 30, 3, { up: 2 });
  addFx(p.x, p.y, 'sparkle');
  sfx('rare');
  G.dirty.gold = 1; G.dirty.bag = 1;
  saveGame();
  return true;
}

function portalDest(D) { const X = DIMENSIONS.find((x) => x.id === D.id); return X ? Object.assign({}, X, D) : D; }
const PV_CACHE = new Map();
function portalPreview(D) {
  if (PV_CACHE.has(D.id)) return PV_CACHE.get(D.id);
  const c = mkCanvas(112, 48), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const [base, path, pond] = D.pv.floor.map((k) => TILE[T[k]]);
  for (let y = 0; y < 3; y++) for (let x = 0; x < 7; x++) {
    const t = x >= 5 && y >= 1 ? pond : y === 2 ? path : base;

    const s = ob.spr[0];

function genRaid(R) {
  const W = 27, H = 27, c = 13;
  const m = new GameMap('raid_' + R.id, 'Raide: ' + R.n, W, H, { dark: R.id !== 'pudim' });
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { m.setT(x, y, T[R.wl]); m.z[m.idx(x, y)] = 40; }
  circleDo(c, c, 11.4, (x, y) => m.setT(x, y, T[R.fl]));
  for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 + 0.5; m.setO(Math.round(c + Math.cos(a) * 8), Math.round(c + Math.sin(a) * 8), O.BRAZIER); }
  m.setO(c, c + 10, O.PORTAL);
  m.anchors.hub = { x: c, y: c + 8 }; m.anchors.boss = { x: c, y: c - 4 };
  return m;
}
for (const R of RAIDS) { MAPGEN['raid_' + R.id] = () => genRaid(R); MAPNAMES['raid_' + R.id] = 'Raide: ' + R.n; }
function isRaidMap(id) { return typeof id === 'string' && id.startsWith('raid_'); }
function raidKey(R) { return R.id + '|' + (NET.pt || 'solo' + (NET.me || '')); }
function raidMul(v, k) { return Array.isArray(v) ? v.map((x) => Math.round(x * k)) : Math.round(v * k); }

function raidTotalDmg() {
  const S = RAID.st;

}
function raidAllies() { const S = RAID.st; let n = 0; for (const a of G.peers.values()) if (a.rd && a.rd.k === S.k && a.map === 'raid_' + S.id && !a.dead) n++; return n; }

function raidEnter(R) {

  if (!keep) RAID.st = { k, id: R.id, R, t0: G.t, dmg: 0, max: Math.round(MON[R.boss].hp * RAID_HP), phase: 0, over: false, won: false, warn: {}, nextAoe: G.t + 9000, mn: null, lastHp: 0 };

}
function raidSpawnBoss() {
  const S = RAID.st, m = G.map, R = S.R, d = MON[R.boss], b = m.anchors.boss;
  const def = Object.assign({}, d, { name: d.name + ' (Raide)', hp: S.max, dmg: raidMul(d.dmg, 1.35), xp: d.xp * 4 });
  const mn = spawnMonster(m, R.boss, b.x, b.y, { r: 3 });

  mn.def = def; mn.maxHp = S.max; mn.dmg = def.dmg; mn.raid = true; mn.hitByPlayer = true;
  mn.hp = Math.max(1, S.max - raidTotalDmg());

function raidTick() {
  const S = RAID.st;
  if (!S || S.over) return;
  const left = RAID_TIME - (G.t - S.t0);
  if (left <= 0) return raidEnd('O tempo acabou! A raide falhou.');
  for (const w of [300000, 120000, 60000, 30000, 10000]) if (left < w && !S.warn[w]) { S.warn[w] = 1; notice('Raide: ' + (w >= 60000 ? w / 60000 + ' min' : w / 1000 + ' s') + ' restantes!', '#ffd27a'); }

  if (m.id !== 'raid_' + S.id || !mn) return;
  if (mn.dead) { if (S.lastHp > 0) S.dmg += S.lastHp; S.lastHp = 0; return raidWin(); }
  const lost = S.lastHp - mn.hp;
  if (lost > 0) { S.dmg += lost; netPresence(); }
  const hp = S.max - raidTotalDmg();
  mn.hp = Math.max(0, Math.min(mn.maxHp, hp)); S.lastHp = mn.hp;
  if (hp <= 0) { mn.hp = 0; S.lastHp = 0; killMonster(mn, G.p); return raidWin(); }
  const ph = hp < S.max * 0.25 ? 3 : hp < S.max * 0.5 ? 2 : hp < S.max * 0.75 ? 1 : 0;
  if (ph > S.phase) { S.phase = ph; raidPhase(ph); }
  if (G.t >= S.nextAoe) { S.nextAoe = G.t + Math.max(4500, 9500 - S.phase * 1500); raidAoe(); }
}
// fases: reforços e, na última, fúria
function raidPhase(ph) {
  const S = RAID.st, m = G.map, mn = S.mn, L = MON[S.R.boss].lvl;
  const pool = Object.values(MON).filter((d) => !d.boss && !d.ally && d.lvl >= L * 0.55 && d.lvl <= L * 1.05);
  const n = 2 + ph + raidAllies();
  for (let i = 0; i < n && pool.length; i++) {
    const a = spawnMonster(m, pool[Math.floor(Math.random() * pool.length)].id, mn.x, mn.y, { r: 5, summoned: true, master: mn });
    if (a) mn.minions.push(a);
  }
  if (ph === 3) {
    mn.dmg = raidMul(mn.dmg, 1.25);

// ataques em área com aviso vermelho no chão
function raidAoe() {

function raidWin() {

const FILTER = (() => {

  const ALLOW = new Set(["fuvgnxr", "fuvvgnxr", "iretnb", "iretbrf", "pbpxre", "pbpxref", "fphagubecr", "rffrk", "fhffrk"].map((w) => s1(rot(w))));
  const PHRASES = ["inv fr zngne", "in fr zngne", "fr zngn", "fr zngr", "fr zngne", "zr zngne", "xvyy lbhefrys", "xvyy hefrys", "xvyy lbhe frys", "baqr ibpr zben", "baqr ip zben", "baqr gh zben", "baqr pr zben", "frh raqrerpb", "grh raqrerpb", "znaqn sbgb", "zr znaqn sbgb", "znaqn hzn sbgb", "znaqn fhn sbgb", "znaqn ghn sbgb", "frh ahzreb", "grh ahzreb"].map((p) => rot(p).split(' ').map(s1));
  function bad(raw) {
    if (!raw) return false;
    const a = s1(raw);
    if (ALLOW.has(a)) return false;
    if (EXACT.has(a)) return true;
    for (const r of ROOTS) if (a.includes(r)) return true;
    if (ROOTS2.length) { const b = s2(raw); for (const r of ROOTS2) if (b.includes(r)) return true; }
    for (const B of BASES) {
      if (a === B.b) return true;
      if (a.length > B.b.length && a.startsWith(B.b) && (B.en ? ESUF : SUF).has(a.slice(B.b.length))) return true;
      if (B.stem && a.length > B.stem.length && a.startsWith(B.stem) && VSUF.has(a.slice(B.stem.length))) return true;
    }
    return false;
  }
  // ---------- contato fora do jogo ----------
  const URL_RE = /\b(?:https?:\/\/|www\.)\S+/gi;
  const DOMAIN_RE = /\b[a-z0-9][a-z0-9-]+(?:\.|\s*\(\s*dot\s*\)\s*|\s*\[\s*dot\s*\]\s*)(?:com|net|org|gg|io|me|tv|xyz|link|app|site|online|info|ly|br|co|us|ru|to|live|shop|store)\b(?:[./]\S*)?/gi;

  const HANDLE_RE = /(^|\s)(@[A-Za-z0-9_.]{3,})/g;

  const BAD_EMOJI = [String.fromCodePoint(0x1f595)];
  function check(text) {
    const s = String(text || '');
    const mask = new Uint8Array(s.length);
    let hit = false;
    const mark = (a, b) => { for (let i = a; i < b; i++) if (s[i] !== ' ') mask[i] = 1; hit = true; };
    for (const re of [URL_RE, DOMAIN_RE, EMAIL_RE]) { re.lastIndex = 0; let m; while ((m = re.exec(s))) { if (!m[0].length) { re.lastIndex++; continue; } mark(m.index, m.index + m[0].length); } }

    for (const e of BAD_EMOJI) for (let i = s.indexOf(e); i >= 0; i = s.indexOf(e, i + 1)) mark(i, i + e.length);
    // palavras
    const toks = [];
    const TOK = /\S+/g;
    for (let m; (m = TOK.exec(s));) {
      const a = m.index, b = a + m[0].length;
      let k = '', k2 = '';
      for (let i = a; i < b; i++) {
        const c = s.charCodeAt(i);
        if (c >= 0xd800 && c <= 0xdbff) { i++; continue; }
        k += fold(s[i], true); k2 += fold(s[i], false);
      }
      toks.push({ a, b, k, k2 });
    }
    const markTok = (t) => mark(t.a, t.b);
    for (const t of toks) if (bad(t.k) || bad(t.k2) || CONTACT.has(s1(t.k2)) || CONTACT.has(s1(t.k))) markTok(t);
    // letras soltas: p o r r a
    for (let i = 0; i < toks.length;) {
      if (toks[i].k.length !== 1) { i++; continue; }
      const run = [];
      let j = i;
      while (j < toks.length && j - i < 40) {
        const L = toks[j].k.length;
        if (L === 1) run.push(toks[j]);
        else if (L !== 0) break;
        j++;
      }
      if (run.length >= 2) {
        const letters = run.map((t) => t.k);
        for (let x = 0; x < run.length; x++) for (let y = x + 2; y <= Math.min(run.length, x + 16); y++) {
          if (bad(letters.slice(x, y).join(''))) for (let z = x; z < y; z++) markTok(run[z]);
        }
      }
      i = Math.max(j, i + 1);
    }
    // frases
    const words = toks.map((t) => s1(t.k2 || t.k));
    for (const P of PHRASES) {
      for (let x = 0; x + P.length <= words.length; x++) {
        let ok = true;
        for (let y = 0; y < P.length && ok; y++) if (words[x + y] !== P[y]) ok = false;
        if (ok) for (let y = 0; y < P.length; y++) markTok(toks[x + y]);
      }
    }
    if (!hit) return { text: s, hit: false };
    let out = '';
    for (let i = 0; i < s.length; i++) out += mask[i] ? '#' : s[i];
    return { text: out, hit: true };
  }
  // ---------- anti-spam (mensagens que eu envio) ----------
  const hist = [];
  function tidy(text) {
    let t = String(text || '').replace(/\s+/g, ' ').trim();
    t = t.replace(/(.)\1{4,}/g, '$1$1$1$1');
    let up = 0, letters = 0;
    for (const ch of t) { const lo = ch.toLowerCase(), hi = ch.toUpperCase(); if (lo !== hi) { letters++; if (ch === hi) up++; } }
    if (letters >= 8 && up / letters > 0.7) t = t.toLowerCase();
    return t;
  }
  function outgoing(text) {
    const t = tidy(cleanText(text)).slice(0, 120);
    if (!t) return { ok: false, why: '' };
    const now = Date.now();
    while (hist.length && now - hist[0].t > 20000) hist.shift();
    if (hist.filter((h) => now - h.t < 6000).length >= 4) return { ok: false, why: 'Calma! Espere alguns segundos para falar de novo.' };
    const key = t.toLowerCase();
    if (hist.some((h) => h.k === key && now - h.t < 12000)) return { ok: false, why: 'Você acabou de dizer isso.' };
    hist.push({ t: now, k: key });
    const r = check(t);
    return { ok: true, text: r.text, hit: r.hit };
  }
  function incoming(text) { return check(tidy(cleanText(text)).slice(0, 120)).text; }
  function badName(name) { return check(String(name || '')).hit; }
  return { check, outgoing, incoming, badName, bad };
})();

// ---- 66-guilds.js ----
// ============================================================
// QUADRIA — Gildas
// Cada jogador guarda a própria gilda no save. Pelo saguão (presença
// que todos os servidores compartilham) a gilda vê quem está online em
// qualquer servidor, recebe convites e conversa no chat da gilda (/gu).
// Bônus: +10% de experiência com outro membro online.
// ============================================================
const GUILD = { peers: new Map(), seen: new Map(), inv: [], gcI: 0, gc: null, got: new Set(), key: '' };
const GUILD_COST = 5000, GUILD_LVL = 10, GUILD_COLS = ['#ffd27a', '#7fe07f', '#8fc8ff', '#ff8ad8', '#ff8a6a', '#cfa6ff'];
const GRANK = { l: 'Líder', o: 'Oficial', m: 'Membro' };
NPCS.comandante.roles = ['raid', 'guild'];

function myGuild() { return G.p && G.p.guild; }
function guildTagOf(a) { const g = a && a.by ? GUILD.peers.get(a.by) : null; return g && g.t ? g : null; }
function guildOnline() { const g = myGuild(); if (!g) return []; return [...GUILD.peers.values()].filter((x) => x.id === g.id && x.by !== NET.uid); }
function guildXpMul() { return myGuild() && guildOnline().length ? 1.1 : 1; }
function guildPublish() {
  if (!NET.lobby) return;
  const g = myGuild(), p = G.p;
  const pres = { gd: null, gi: null, gc: null, gk: null };
  if (g) {
    pres.gd = { id: g.id, n: g.n, t: g.t, c: g.c, r: g.rank, lead: g.lead, nm: myNetName(), lv: p.lvl, sv: !NET.sv ? '' : NET.sv.startsWith('pv-') ? 'privado' : NET.sv };
    if (g.x) pres.gd.x = 1;
    const now = Date.now();
    GUILD.inv = GUILD.inv.filter((i) => now - i.at < 60000);
    if (GUILD.inv.length) pres.gi = GUILD.inv.map((i) => ({ to: i.to, id: g.id, n: g.n, t: g.t, c: g.c, lead: g.lead }));
    if (GUILD.gc && now - GUILD.gc.at < 30000) pres.gc = GUILD.gc;
    if (g.rank !== 'm' && (g.kicked || []).length) pres.gk = g.kicked.slice(-20);
    if (g.rank === 'l') pres.gd.of = Object.keys(g.roster || {}).filter((b) => g.roster[b].r === 'o').slice(0, 20);
  }
  const k = JSON.stringify(pres);
  if (k === GUILD.key && GUILD.lob === NET.lobby) return;
  GUILD.lob = NET.lobby;
  GUILD.key = k;
  NET.lobby.presence(pres).catch(() => {});
}
// chega a lista do saguão: gildas de todo mundo, convites, expulsões e chat
function guildLobby(peers) {
  const g = myGuild(), now = Date.now(), live = new Set();
  GUILD.peers.clear();
  for (const pe of peers) {
    const q = pe.presence || {}, by = pe.by;
    if (!by || NET.bans.has(by)) continue;
    const d = q.gd;
    if (d && typeof d === 'object' && typeof d.id === 'string' && d.id.length < 40) {
      const tg = FILTER.check(cleanText(String(d.t || '')).slice(0, 4)), nm = FILTER.check(cleanText(String(d.n || '')).slice(0, 20));
      GUILD.peers.set(by, { by, id: d.id, n: nm.hit ? 'Gilda' : nm.text, t: tg.hit ? '' : tg.text, c: GUILD_COLS.includes(d.c) ? d.c : GUILD_COLS[0], r: GRANK[d.r] ? d.r : 'm', lead: String(d.lead || ''), nm: cleanText(String(d.nm || '?')).slice(0, 20), lv: clamp(d.lv | 0, 1, 999), sv: String(d.sv || '').slice(0, 30), x: !!d.x, of: Array.isArray(d.of) ? d.of.filter((b) => typeof b === 'string').slice(0, 20) : [] });
      live.add(by);
    }
    if (by === NET.uid || !G.started) continue;
    const info = GUILD.peers.get(by);
    // convite para mim
    if (!g && Array.isArray(q.gi)) for (const iv of q.gi.slice(0, 10)) {
      if (!iv || iv.to !== NET.uid || typeof iv.id !== 'string') continue;
      const key = by + '|' + iv.id;
      if (GUILD.got.has(key)) continue;
      GUILD.got.add(key);
      if (!isMuted({ mkey: 'u:' + by })) UI.guildInvite({ from: info ? info.nm : 'Alguém', id: iv.id.slice(0, 40), n: cleanText(String(iv.n || 'Gilda')).slice(0, 20), t: cleanText(String(iv.t || '')).slice(0, 4), c: GUILD_COLS.includes(iv.c) ? iv.c : GUILD_COLS[0], lead: String(iv.lead || '').slice(0, 80) });
    }
    if (!g || !info || info.id !== g.id) continue;
    // líder ou oficial me expulsou / gilda desfeita / patente nova
    if (info.r !== 'm' && Array.isArray(q.gk) && q.gk.includes(NET.uid)) { guildDrop('Você foi expulso da gilda ' + g.n + '.'); return guildPublish(); }
    if (info.x && by === g.lead) { guildDrop('A gilda ' + g.n + ' foi desfeita pelo líder.'); return guildPublish(); }
    if (by === g.lead && g.rank !== 'l') { const nr = info.of.includes(NET.uid) ? 'o' : 'm'; if (nr !== g.rank) { g.rank = nr; log('Gilda: agora você é ' + GRANK[nr] + '.', 'guild'); guildPublish(); } }
    // ficha de quem está online
    g.roster = g.roster || {};
    const ro = g.roster[by] || {};
    if (!(g.kicked || []).includes(by)) g.roster[by] = { nm: info.nm, lv: info.lv, r: g.rank === 'l' ? (ro.r === 'o' ? 'o' : info.r === 'l' ? 'l' : 'm') : info.r, seen: now };
    // chat da gilda
    const c = q.gc;
    if (c && typeof c === 'object' && typeof c.i === 'number' && typeof c.t === 'string') {
      const last = GUILD.seen.get(by);
      GUILD.seen.set(by, c.i);
      if ((last === undefined ? now - (+c.at || 0) < 8000 : c.i > last) && !isMuted({ mkey: 'u:' + by })) {
        const r = FILTER.check(cleanText(c.t).slice(0, 140));
        log('[Gilda] ' + info.nm + ': ' + r.text, 'guild');
      }
    }
  }
  if (g && g.rank === 'l') for (const b in g.roster || {}) if (g.roster[b].r === 'l' && b !== NET.uid) g.roster[b].r = 'm';
  if (winOpen('guild')) UI.openGuild(true);
}
function guildDrop(msg) { G.p.guild = null; GUILD.inv = []; log(msg, 'guild'); notice(msg, '#ff8a6a'); G.saveDirty = true; if (winOpen('guild')) UI.openGuild(true); }
function guildCreate(n, t, c) {
  const p = G.p;
  n = cleanText(n).replace(/\s+/g, ' ').trim(); t = cleanText(t).replace(/[^A-Za-z0-9À-ú]/g, '').toUpperCase();
  if (myGuild()) return notice('Você já está numa gilda.', '#ff8a6a');
  if (p.lvl < GUILD_LVL) return notice('Fundar uma gilda exige nível ' + GUILD_LVL + '.', '#ff8a6a');
  if (n.length < 3 || n.length > 20) return notice('O nome da gilda precisa de 3 a 20 letras.', '#ff8a6a');
  if (t.length < 2 || t.length > 4) return notice('A sigla precisa de 2 a 4 letras ou números.', '#ff8a6a');
  if (FILTER.check(n).hit || FILTER.check(t).hit || FILTER.badName(n)) return notice('Esse nome ou sigla não é permitido.', '#ff8a6a');
  if (p.gold < GUILD_COST) return notice('Fundar uma gilda custa ' + fmt(GUILD_COST) + ' de ouro.', '#ff8a6a');
  p.gold -= GUILD_COST; G.dirty.gold = 1;
  p.guild = { id: 'g' + Math.random().toString(36).slice(2, 10), n, t, c: GUILD_COLS.includes(c) ? c : GUILD_COLS[0], lead: NET.uid || 'local', rank: 'l', since: Date.now(), roster: {}, kicked: [] };
  log('Gilda [' + t + '] ' + n + ' fundada! Convide jogadores pela janela da gilda ou clicando neles.', 'quest');
  notice('Gilda fundada!', '#ffe066'); sfx('rare');
  saveGame(); guildPublish(); UI.openGuild(true);
}
function guildInvite(by, name) {
  const g = myGuild();
  if (!g || g.rank === 'm') return notice('Só o líder e os oficiais convidam.', '#ff8a6a');
  if (!netOnline() || !by) return notice('Esse jogador não está online.', '#ff8a6a');
  const o = GUILD.peers.get(by);
  if (o && o.id === g.id) return notice(name + ' já está na gilda.', '#c8b8a0');
  if (o) return notice(name + ' já está em outra gilda.', '#ff8a6a');
  g.kicked = (g.kicked || []).filter((b) => b !== by);
  GUILD.inv = GUILD.inv.filter((i) => i.to !== by).concat([{ to: by, at: Date.now() }]);
  log('Convite da gilda enviado para ' + name + '.', 'guild');
  guildPublish();
}
function guildByName(name) { name = String(name || '').trim().toLowerCase(); for (const [by, x] of GUILD.peers) if (x.nm.toLowerCase() === name) return by; for (const a of G.peers.values()) if (a.by && a.name.toLowerCase() === name) return a.by; return null; }
function guildSay(t) {
  const g = myGuild();
  if (!g) return notice('Você não está numa gilda.', '#ff8a6a');
  t = cleanText(t).trim().slice(0, 140);
  if (!t) return;
  const txt = FILTER.check(t).text;

}
function guildKick(by) {
  const g = myGuild(), m = g && g.roster && g.roster[by];
  if (!g || g.rank === 'm' || !m || m.r === 'l' || (m.r === 'o' && g.rank !== 'l')) return;
  g.kicked = (g.kicked || []).filter((b) => b !== by).concat([by]);
  delete g.roster[by];
  log(m.nm + ' foi expulso da gilda.', 'guild');
  G.saveDirty = true; guildPublish(); UI.openGuild(true);
}
function guildPromote(by) {
  const g = myGuild(), m = g && g.roster && g.roster[by];
  if (!g || g.rank !== 'l' || !m || m.r === 'l') return;
  m.r = m.r === 'o' ? 'm' : 'o';
  log(m.nm + ' agora é ' + GRANK[m.r] + '.', 'guild');
  G.saveDirty = true; guildPublish(); UI.openGuild(true);
}
function guildLeave() {
  const g = myGuild();
  if (!g) return;
  if (g.rank === 'l') { g.x = 1; guildPublish(); setTimeout(() => { if (G.p.guild === g) { guildDrop('Você desfez a gilda ' + g.n + '.'); guildPublish(); } }, 8000); notice('Desfazendo a gilda...', '#ff8a6a'); return; }
  guildDrop('Você saiu da gilda ' + g.n + '.');
  guildPublish();
}

UI.guildInvite = (iv) => {

UI.openGuild = (refresh) => {

    const r = el('div', 'row'); r.append(n, t);

    if (!m.me && g.rank !== 'm' && m.r === 'm' || (!m.me && g.rank === 'l' && m.r === 'o')) acts.appendChild(btn('Expulsar', () => guildKick(by), 'danger'));

  }

    const r = el('div', 'row coderow');
    const inp = el('input', 'svcode'); inp.placeholder = 'Nome do jogador para convidar'; inp.maxLength = 20;
    r.append(inp, btn('Convidar', () => { const by = guildByName(inp.value); if (!by) return notice('Ninguém online com esse nome.', '#ff8a6a'); guildInvite(by, inp.value.trim()); inp.value = ''; }, 'pri'));

  }

// O nome "caio_admin1615" é reservado: só cria o personagem com a senha.
// O código guarda apenas o resumo SHA-256 da senha, nunca a senha.
// O administrador tem o painel /admin (ouro, nível, itens, teleporte,
// modo deus, hora do dia, curar e limpar monstros).
// ============================================================
const ADMIN_NAME = 'caio_admin1615';
const ADMIN_HASH = '53bf69ac7e67c810817f0fc5fb21f40f25b66d548d2a35a6f39ece40cb503467';
function isAdminName(n) { return String(n || '').trim().toLowerCase() === ADMIN_NAME; }
async function adminCheck(pw) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('quadria-admin:' + pw));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('') === ADMIN_HASH;
  } catch (e) { return false; }
}
function isAdmin() { return !!(G.p && G.p.admin && isAdminName(G.p.name)); }

  const sec = (t) => b.appendChild(el('h4', null, t));
  const row = () => b.appendChild(el('div', 'row'));

  );
  r = row();
  const lv = el('input', 'svcode'); lv.type = 'number'; lv.min = '1'; lv.max = '300'; lv.value = String(p.lvl); lv.style.maxWidth = '110px';
  r.append(lv, btn('Definir nível', () => {

  }));
  sec('Dar item');

  };
  q.addEventListener('input', search); rar.addEventListener('change', search);
  sec('Teleporte');
  r = row();
  const mp = el('select', 'svcode');
  for (const id in MAPGEN) { const o = el('option', null, MAPNAMES[id] || id); o.value = id; mp.appendChild(o); }
  mp.value = G.map.id;
  r.append(mp, btn('Ir', () => {
    const id = mp.value, m = getMap(id), a = m.anchors && (m.anchors.hub || m.anchors.entry);

    const to = a || (w ? { x: w.x, y: w.y } : freeNear(m, m.w >> 1, m.h >> 1, 40));
    closeWin('admin');
    changeMap(id, to);
  }, 'pri'));
  sec('Mundo');
  r = row();
  r.append(
    btn('Dia', () => { G.dayT = 0.45; notice('Dia', '#ffe066'); }),
    btn('Noite', () => { G.dayT = 0.95; notice('Noite', '#8fc8ff'); }),
    btn('Derrotar monstros por perto', () => {
      let n = 0;
      for (const mn of G.map.mons.slice()) if (!mn.dead && !mn.ally && cheb(mn, p) <= 10) { mn.hitByPlayer = true; killMonster(mn, p); n++; }

    }, 'danger'),
  );
  b.appendChild(el('p', 'hint', 'Atalho: /admin abre este painel. Esta conta só existe neste navegador (o save fica no aparelho).'));
};

REALMS.forEach((R, i) => {
  ZONES[50 + i] = { n: R.n, lv: [R.lvl, R.lvl + 10], dens: 0.024, mons: R.mons.map((m, k) => [m, 3 - k * 0.5]) };
  if (typeof ZONEMOOD === 'object') ZONEMOOD[50 + i] = i % 2 ? 'void' : 'abyss';
  MAPGEN['reino_' + i] = () => genReino(i);
  MAPNAMES['reino_' + i] = R.n;
});
function genReino(i) {
  const R = REALMS[i], W = 64, H = 64, RR = mulberry32(5150 + i * 77);
  const c = hexToRgb(R.col);
  const m = new GameMap('reino_' + i, R.n, W, H, { dark: 0.42, tint: 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.07)' });
  genCaveLayout(m, { W, H, floor: T.SHF0 + i, wall: T.W_SHADOW }, RR);
  const entry = nearestFloor(m, 7, H >> 1);
  circleDo(entry.x, entry.y, 3.2, (x, y) => { if (x > 1 && y > 1 && x < W - 2 && y < H - 2) m.setT(x, y, T.SHF0 + i); });
  let d = bfsDist(m, entry.x, entry.y), bi = 0;
  for (let k = 0; k < d.length; k++) if (d[k] > d[bi]) bi = k;
  const far = { x: bi % W, y: (bi / W) | 0 };
  circleDo(far.x, far.y, 4.5, (x, y) => { if (x > 1 && y > 1 && x < W - 2 && y < H - 2) m.setT(x, y, T.SHF0 + i); });
  m.z.fill(50 + i);
  const prot = new Uint8Array(W * H);
  protectAround(m, prot, entry.x, entry.y, 6); protectAround(m, prot, far.x, far.y, 3);
  circleDo(entry.x, entry.y, 3.2, (x, y) => { if (m.inb(x, y)) m.pz[m.idx(x, y)] = 1; });
  m.setO(entry.x, entry.y - 1, O.FONTE_A);
  m.anchors.hub = { x: entry.x, y: entry.y + 1 }; m.anchors.boss = far;
  m.spawns.push({ mon: R.boss, x: far.x, y: far.y, boss: true });
  scatterDeco(m, RR, prot, [T.SHF0 + i], [[O.SH_CRYS, 3], [O.SH_PILAR, 2]], 0.035);
  randomChests(m, RR, prot, 5, R.lvl, R.lvl + 10);
  zoneSpawns(m, RR, prot);
  pruneSpawns(m, entry);
  return m;
}

const FONTES = { list: [], at: new Map(), guard: {}, fx: null, pkey: null, pmap: null };
{
  const gen = MAPGEN.ov;
  MAPGEN.ov = (...a) => { const m = gen(...a); try { placeFontes(m); } catch (e) { console.error('fontes', e); } return m; };
}
function placeFontes(m) {
  const RR = mulberry32(90210), T0 = TEMPLES.aurora, d = bfsDist(m, T0.x, T0.y);
  const keep = (q) => m.chests.has(q) || m.ways.has(q) || m.signs.has(q) || m.warps.has(q);
  const byZone = new Map();
  for (let y = 4; y < m.h - 4; y++) for (let x = 4; x < m.w - 4; x++) {
    const i = m.idx(x, y), Z = ZONES[m.z[i]];
    if (d[i] < 0 || m.pz[i] || !Z || !Z.lv || Z.safe) continue;
    let ok = true;
    for (let j = -1; j <= 1 && ok; j++) for (let k = -1; k <= 1; k++) { const q = m.idx(x + k, y + j); if (m.blocked(x + k, y + j) || m.o[q] || m.pz[q] || keep(q)) { ok = false; break; } }
    if (!ok) continue;
    if (!byZone.has(m.z[i])) byZone.set(m.z[i], []);
    byZone.get(m.z[i]).push([x, y]);
  }
  const used = new Map();
  FONTES.list = []; FONTES.at.clear();
  REALMS.forEach((R, i) => {
    let bz = null, bd = 1e9;
    for (const [z, list] of byZone) {
      const u = used.get(z) || 0;
      if (u >= 2 || list.length < 20) continue;
      const Z = ZONES[z], dd = Math.abs(Z.lv[0] - R.lvl) + (Z.lv[0] > R.lvl ? 30 : 0) + u * 12;
      if (dd < bd) { bd = dd; bz = z; }
    }
    if (bz === null) return;
    used.set(bz, (used.get(bz) || 0) + 1);
    const all = byZone.get(bz), dist = ([x, y]) => FONTES.list.reduce((a, F) => (F ? Math.min(a, Math.hypot(F.x - x, F.y - y)) : a), 1e9);
    let list = all.filter((c) => dist(c) >= 25);
    if (!list.length) { const best = Math.max(...all.map(dist)); list = all.filter((c) => dist(c) >= best - 2); }
    const [x, y] = list[Math.floor(RR() * list.length)];
    // clareira em volta da fonte
    for (let j = -2; j <= 2; j++) for (let k = -2; k <= 2; k++) { const q = m.idx(x + k, y + j); if (m.inb(x + k, y + j) && m.o[q] && !keep(q) && !m.pz[q]) m.setO(x + k, y + j, 0); }
    m.setO(x, y, O.FONTE_S);
    FONTES.list[i] = { x, y, z: bz, zn: ZONES[bz].n };
    FONTES.at.set(m.idx(x, y), i);
  });
}
function dayKey(t) { const d = new Date(t || Date.now()); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function fonteState(i) { return (G.p && G.p.fontes && G.p.fontes[i]) || 0; }
function fontesApply() {
  const m = G.maps.ov;
  if (!m) return;
  FONTES.list.forEach((F, i) => { if (F) { const s = fonteState(i); m.setO(F.x, F.y, s === 2 ? O.FONTE_P : s === 1 ? O.FONTE_A : O.FONTE_S); } });
  FONTES.pkey = G.p; FONTES.pmap = m;
}
function isFonteObj(o) { return o === O.FONTE_S || o === O.FONTE_A || o === O.FONTE_P; }
function fonteInteract(m, x, y) {
  const p = G.p;
  if (m.id.startsWith('reino_')) {
    const F = FONTES.list[+m.id.slice(6)];
    if (F) { sfx('portal'); changeMap('ov', freeNear(getMap('ov'), F.x, F.y + 1, 4)); } else travelTo('w_aurora');
    return true;
  }
  const i = FONTES.at.get(m.idx(x, y));
  if (i === undefined) return false;
  const R = REALMS[i], st = fonteState(i);
  if (st === 2) { UI.openFonte(i); return true; }
  if (st === 1) { fonteEnter(i); return true; }
  if (p.lvl < R.lvl) { notice('A fonte resiste a você... volte no nível ' + R.lvl + '.', '#ff8a6a'); return true; }
  const g = FONTES.guard[i];
  if (g && !g.dead && g.map === 'ov') { notice('Derrote ' + g.def.name + ' para abrir a fonte!', '#ff8a6a'); return true; }
  const pos = freeNear(m, x, y + 2, 3);
  const mn = spawnMonster(m, R.guard, pos.x, pos.y, { r: 2 });
  if (!mn) return true;
  mn.fonte = i; mn.provoked = G.t; FONTES.guard[i] = mn;
  say(mn, 'Ninguém abre esta fonte!', R.col, true);
  notice('A fonte está selada. ' + mn.def.name + ' desperta!', R.col);
  G.shake = Math.max(G.shake, 10);
  burst(x + 0.5, y + 0.2, [R.col, '#ffffff', '#1a1428'], 40, 4, { life: 900 });
  sfx('boss');
  return true;
}
function fonteEnter(i) {
  const R = REALMS[i], m = getMap('reino_' + i);
  if (FISHING.st) fishCancel();
  changeMap('reino_' + i, m.anchors.hub);
  FONTES.fx = { kind: 'enter', i, t0: G.t };
  notice(R.n, R.col);
  log('Você entrou no ' + R.n + '. As sombras atiram rajadas: ande para desviar! O soberano está no fundo do reino. Volte pela fonte da entrada.', 'quest');
  sfx('portal');
  track('reino', 1);
}
function fonteOpen(i) {
  const p = G.p, R = REALMS[i], F = FONTES.list[i];
  p.fontes = p.fontes || {};
  p.fontes[i] = 1;
  fontesApply();
  FONTES.fx = { kind: 'open', i, t0: G.t };
  G.shake = Math.max(G.shake, 18);
  notice('A FONTE SE ABRIU!', R.col);
  log('Uma fonte se abriu! Um pilar de luz leva ao ' + R.n + '. Toque na fonte para entrar.', 'quest');
  if (F) burst(F.x + 0.5, F.y - 0.5, [R.col, '#ffffff', '#ffe066'], 70, 6, { up: 3, life: 1400 });
  sfx('rare'); setTimeout(() => sfx('boss'), 300);
  track('fonte', 1);
  saveGame();

    case 'cross': { const a0 = Math.random() < 0.5 ? 0 : 0.785; emit(220, 1500, () => { for (let k = 0; k < 4; k++) F(a0 + k * 1.5708); }); break; }

function bulletTick(dt) {
  const s = dt / 1000, p = G.p, m = G.map;

    const e = BUL.em[i];
    if (G.t > e.end || e.src.dead || e.src.map !== m.id) { BUL.em.splice(i, 1); continue; }

function drawBullets(g, camPX, camPY, S) {

const WING_SPR = new Map();

const WING_ROWS = [[12, 19], [8, 19], [5, 19], [3, 19], [1, 19], [0, 19], [0, 18], [1, 18], [2, 17], [4, 17], [6, 16], [8, 16], [10, 15], [12, 15]];

  const base = rb ? '#ffffff' : c, line = rb ? '#4a3a6a' : shade(c, -0.55);

    WING_ROWS.forEach(([a, b], y) => {

        P.p(x, y + 1, rb ? RB[(band + y) % 6] : band % 2 ? c2 : base);
      }
    });
    // penas: riscos escuros saindo da raiz
    for (let k = 0; k < 4; k++) for (let i = 0; i < 9; i++) { const x = 18 - i * 2, y = 3 + k * 3 + (i >> 1); const row = WING_ROWS[y - 1]; if (row && x >= row[0] + 1 && x <= row[1]) P.p(x, y, line); }
    P.r(13, 1, 6, 1, '#ffffff'); P.r(9, 2, 4, 1, rb ? '#ffffff' : shade(base, 0.35));

function track(k, n) {

  if (PASSIVE[k]) { PROG.frac += PASSIVE[k] * n; if (PROG.frac >= 1) { const w = Math.floor(PROG.frac); PROG.frac -= w; passXp(w); } }
  missEnsure();

    q.c = Math.min(M0.n, q.c + n);

      q.done = 1;
      p.gold += M0.xp * 10; G.dirty.gold = 1;
      notice('Missão diária concluída!', '#7fe07f');
      log('Missão diária: "' + M0.t + '" concluída! +' + M0.xp + ' XP de Passe e ' + fmt(M0.xp * 10) + ' de ouro.', 'quest');

}

function missEnsure() {
  const p = G.p, day = dayKey();
  if (p.miss && p.miss.day === day) return;
  const R = mulberry32(codeHash(day + '|' + p.name).split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7) >>> 0);
  const idx = [];
  for (let tries = 0; idx.length < 3 && tries < 500; tries++) { const i = Math.floor(R() * MISS.length); if (MISS[i].lv <= p.lvl && !idx.some((j) => MISS[j].k === MISS[i].k)) idx.push(i); }

}

const EVENTS = [
  { id: 'xp', n: 'Hora da Experiência', d: '+50% de experiência para todos!', col: '#7fe07f' },
  { id: 'estrelas', n: 'Chuva de Estrelas', d: 'Estrelas cadentes caem perto de você: passe por cima para pegar!', col: '#ffe066' },

  { id: 'pesca', n: 'Maré da Sorte', d: 'Pesca com +60% de sorte e mais mutações!', col: '#8fdcff' },
];
const EV_SLOT = 20 * 60000, EV_LEN = 6 * 60000;
function eventNow(t) {
  t = t || Date.now();
  const slot = Math.floor(t / EV_SLOT), into = t - slot * EV_SLOT;
  const E = EVENTS[(slot * 2654435761 >>> 0) % EVENTS.length];
  return into < EV_LEN ? { id: E.id, E, left: EV_LEN - into } : { id: '', E: EVENTS[((slot + 1) * 2654435761 >>> 0) % EVENTS.length], next: EV_SLOT - into };
}
{
  const fs0 = fishStats;
  fishStats = function (...a) { const r = fs0(...a); if (eventNow().id === 'pesca') { r.luck += 60; r.mut = (r.mut || 0) + 0.05; } return r; };
}
function eventsTick() {
  const p = G.p, m = G.map, ev = eventNow();
  const key = ev.id ? ev.id + Math.floor(Date.now() / EV_SLOT) : '';
  if (key !== PROG.evKey) {
    PROG.evKey = key;
    if (ev.id) { notice('EVENTO: ' + ev.E.n + '!', ev.E.col); log('Evento mundial: ' + ev.E.n + ' — ' + ev.E.d, 'quest'); sfx('quest'); }
    // fim da invasão: as sombras que sobraram somem
    if (ev.id !== 'invasao') for (const id in G.maps) for (const mn of G.maps[id].mons) {
      if (!mn.inv || mn.dead) continue;
      mn.dead = true; ACT.delete(mn.id);
      const M2 = G.maps[id], i = M2.idx(mn.x, mn.y);
      if (M2.occ[i] === mn.id) M2.occ[i] = 0;
      if (G.target === mn) setTarget(null);
      if (M2 === m) addFx(mn.x, mn.y, 'poof');
    }
  }
  const bar = $('#evbar');
  if (bar) {
    const txt = ev.id ? '🌠 ' + ev.E.n + ' · ' + Math.ceil(ev.left / 60000) + ' min' : 'Próximo evento: ' + ev.E.n + ' em ' + Math.ceil(ev.next / 60000) + ' min';
    if (bar.textContent !== txt) bar.textContent = txt;
    bar.classList.toggle('on', !!ev.id);
  }
  const wild = m.id === 'ov' || ['doce', 'cristal', 'vazio'].includes(m.id);
  if (ev.id === 'estrelas' && wild && !p.dead && G.t > PROG.evNext) {
    PROG.evNext = G.t + 4000 + Math.random() * 3000;
    for (let k = 0; k < 20; k++) {
      const x = p.x + Math.floor(Math.random() * 13) - 6, y = p.y + Math.floor(Math.random() * 11) - 5;
      if (!m.inb(x, y) || m.blocked(x, y)) continue;
      PROG.stars.push({ x, y, t0: G.t, map: m.id });
      break;
    }
  }
  if (ev.id === 'invasao' && m.id === 'ov' && p.lvl >= 8 && !m.pz[m.idx(p.x, p.y)] && !p.dead && G.t > PROG.evNext) {
    PROG.evNext = G.t + 30000;
    let R = REALMS[0];
    for (const r of REALMS) if (r.lvl <= p.lvl - 2) R = r;
    let n = 0;
    for (let k = 0; k < 3; k++) {
      const pos = freeNear(m, p.x + Math.floor(Math.random() * 11) - 5, p.y + Math.floor(Math.random() * 9) - 4, 4);
      if (!pos || m.pz[m.idx(pos.x, pos.y)]) continue;
      const mn = spawnMonster(m, R.mons[k % 3], pos.x, pos.y, { r: 3 });
      if (mn) { mn.inv = 1; mn.provoked = G.t; addFx(mn.x, mn.y, 'poof'); n++; }
    }
    if (n) notice('Sombras surgiram perto de você!', '#ff6ad5');
  }
  // pegar estrelas
  for (let i = PROG.stars.length - 1; i >= 0; i--) {
    const s = PROG.stars[i];
    if (G.t - s.t0 > 25000 || s.map !== m.id) { PROG.stars.splice(i, 1); continue; }
    if (G.t - s.t0 > 700 && cheb(s, p) === 0) {
      PROG.stars.splice(i, 1);
      const gold = 10 + p.lvl * 5;
      p.gold += gold; G.dirty.gold = 1;
      floatText(s, '+' + fmt(gold) + ' ★', '#ffe066');
      if (Math.random() < 0.025) { const it = makeItem('ovo_comum', 0, 1); if (!addToBag(p, it)) dropItem(p, it); log('Uma estrela trouxe um Ovo de Mascote!', 'loot'); }
      track('estrela', 1); sfx('coin');
    }
  }
}
function drawEvents(g, camPX, camPY, S, now) {
  const m = G.map;

    const x = ((s.x + 0.5) * 16 - camPX + (1 - k) * 60) * S, y = ((s.y + 0.5) * 16 - camPY - (1 - k) * 120) * S;
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = 0.5; g.fillStyle = '#ffe066'; g.beginPath(); g.arc(x, y, (6 + Math.sin(now / 150) * 1.5) * S, 0, 6.283); g.fill();
    if (k < 1) { g.globalAlpha = 0.6; g.strokeStyle = '#fff6b8'; g.lineWidth = 2 * S; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 18 * S, y - 36 * S); g.stroke(); }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    drawText(g, '★', x, y + 3 * S, '#ffffff', Math.round(8 * S));

// ============================================================
// QUADRIA — inicialização e laço principal
// ============================================================
G.titleCam = { x: 100, y: 112 };
G.now = 0;
let lastTS = 0;
function titleTick(dt) {
  G.t += dt;
  const ts = G.now;
  G.titleCam.x = 100 + Math.sin(ts / 21000) * 34;
  G.titleCam.y = 104 + Math.cos(ts / 27000) * 24;
  const m = G.map;
  if (!m) return;
  for (const a of m.mons) {
    if (Math.abs(a.x - G.titleCam.x) > 22 || Math.abs(a.y - G.titleCam.y) > 16) continue;
    advance(a, dt); wander(a);
  }
  for (const n of m.npcActs) advance(n, dt);
  G.dayT = 0.42;
}
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(50, ts - (lastTS || ts));
  lastTS = ts;
  G.now = ts;
  try {
    if (G.started && !G.paused) tick(dt);
    else titleTick(dt);
    G.shake *= Math.pow(0.015, dt / 1000);
    render();
    UI.frame(dt);
  } catch (e) {
    if (!G.errShown) { G.errShown = true; console.error(e); UI.log('Erro interno: ' + (e && e.message), 'err'); }
  }
}
function boot(hotData) {
  const ld = $('#loading');
  const step = (txt, fn) => new Promise((res) => { if (ld) ld.querySelector('span').textContent = txt; setTimeout(() => { fn(); res(); }, 16); });
  step('Desenhando os sprites...', () => { buildSprites(); buildSprites2(); })
    .then(() => step('Erguendo o continente de Quadria...', () => { G.map = getMap('ov'); }))
    .then(() => step('Abrindo os portões...', () => {
      initRender();
      UI.init();
      document.body.classList.add('title');
      if (ld) ld.remove();
      requestAnimationFrame(frame);
      if (hotData && hotData.save) { try { startGame(deserialize(hotData.save)); } catch (e) { console.warn(e); } }
      netInit().catch(() => {});
    }));
  window.addEventListener('beforeunload', () => { if (G.started) saveGame(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.started) saveGame(); });
}
(function () {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(() => ({ save: G.started && G.p ? serialize() : null })); } catch (e) { /* sem hot */ }
  }
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
