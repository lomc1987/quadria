<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quadria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* direção: ardósia arroxeada com bisel de pixel, latão de lanterna e texto pergaminho */
  --ink: #0f0c16;
  --panel: #1c1727;
  --panel2: #251f34;
  --hi: #4a3f63;
  --lo: #08060c;
  --brass: #e8a94a;
  --rune: #6fe3d6;
  --text: #efe4cc;
  --muted: #a99c86;
  --hp: #d8383a;
  --mp: #3f6ef0;
  --xp: #e8c040;
  --display: "Jersey 10", "Pixelify Sans", ui-monospace, monospace;
  --body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  /* layout: mundo à esquerda, coluna lateral de equipamento e mochila, barra de atalhos e console embaixo */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--text); font: 15px/1.35 var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
img { image-rendering: pixelated; }
#app { display: grid; grid-template-columns: minmax(0, 1fr) 316px; grid-template-rows: minmax(0, 1fr) auto; height: 100%; }
body.title #app { grid-template-columns: 1fr; }
body.title #side, body.title #dock, body.title #hud, body.title #sidebtn { display: none; }
#stage { grid-column: 1; grid-row: 1; position: relative; overflow: hidden; min-height: 0; background: #0b0912; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
.panel, .win, #side, #dock { background: var(--panel); }
.bevel { box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); }

/* lateral */
#side { grid-column: 2; grid-row: 1 / 3; overflow-y: auto; border-left: 2px solid var(--lo); padding: 8px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: #3a3150 transparent; }
#me { padding: 8px; background: var(--panel2); box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); }
#me .who { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 6px; }
#mename { font-family: var(--display); font-size: 26px; line-height: 1; color: #ffd27a; letter-spacing: .02em; text-wrap: balance; }
#mesub { color: var(--muted); font-size: 13px; }
.bars { display: grid; gap: 4px; }
.bar { position: relative; height: 15px; background: #0b0910; box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #2e2742; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width .12s linear; }
.bar span { position: relative; display: block; font-size: 11px; line-height: 15px; text-align: center; font-variant-numeric: tabular-nums; text-shadow: 1px 1px 0 #000; font-weight: 600; }
.bar.hp i { background: linear-gradient(#ff6a5a, var(--hp) 55%, #8a1a1a); }
.bar.mp i { background: linear-gradient(#7aa0ff, var(--mp) 55%, #1a2a8a); }
.bar.xp { height: 11px; } .bar.xp span { line-height: 11px; font-size: 10px; }
.bar.xp i { background: linear-gradient(#ffe88a, var(--xp) 60%, #8a6a10); }
.bar.sk { height: 5px; margin-top: 3px; } .bar.sk i { background: var(--rune); }
.bar.thp { height: 10px; width: 160px; } .bar.thp i { background: linear-gradient(#ff6a5a, #c0282a); } .bar.thp span { line-height: 10px; font-size: 9px; }
#mmwrap { background: var(--panel2); padding: 6px; box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); }
#mm { width: 100%; height: 150px; display: block; image-rendering: pixelated; background: #0b0912; cursor: crosshair; box-shadow: inset 0 0 0 1px #000; }
.mmbar { display: flex; align-items: center; gap: 4px; margin-top: 5px; font-size: 12px; color: var(--muted); }
.mmbar #zonename { color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mmbar #coords { font-variant-numeric: tabular-nums; }
.mini { min-width: 24px; height: 22px; padding: 0 6px; background: #2a2338; border: 0; color: var(--text); box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo); cursor: pointer; font-size: 13px; }
.mini:hover { background: #3a3150; }
#equip { display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; justify-content: center; padding: 8px; background: var(--panel2); box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--lo); }
#equip .slot { width: 44px; height: 44px; background-repeat: no-repeat; background-position: center; background-size: 34px; }
#equip .slot.full { background-image: none !important; }
#equip .slot img { width: 38px; height: 38px; left: 3px; top: 3px; }
.estat { width: 44px; height: 44px; display: grid; place-content: center; text-align: center; line-height: 1.05; }
.estat small { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.estat b { font-family: var(--display); font-size: 22px; color: #ffd27a; font-weight: 400; font-variant-numeric: tabular-nums; }
#goldrow { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 0 2px; }
#goldrow .coin { width: 14px; height: 14px; background: radial-gradient(circle at 40% 35%, #fff3a8, #f2c23a 45%, #a87a10); box-shadow: 0 0 0 1px #3a2a08; }
#gold { color: #ffd27a; font-weight: 700; font-variant-numeric: tabular-nums; }
#bagn { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
#bag { display: grid; grid-template-columns: repeat(8, 34px); gap: 3px; justify-content: center; }
.slot { width: 34px; height: 34px; position: relative; background: #120f1a; box-shadow: inset 2px 2px 0 #06050a, inset -2px -2px 0 #2e2742; --rc: transparent; }
.slot img { position: absolute; left: 1px; top: 1px; width: 32px; height: 32px; pointer-events: none; }
.slot.full { cursor: grab; }
.slot.full::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--rc); pointer-events: none; }
.slot.r1 { --rc: #62d462; } .slot.r2 { --rc: #56a8ff; } .slot.r3 { --rc: #bd7bff; } .slot.r4 { --rc: #ff9d33; } .slot.r5 { --rc: #ff4f7b; }
.slot.r4, .slot.r5 { background: radial-gradient(circle, color-mix(in srgb, var(--rc) 28%, #120f1a), #120f1a 70%); }
.slot.r5::after { animation: myth 1.6s ease-in-out infinite; }
@keyframes myth { 50% { box-shadow: inset 0 0 0 2px var(--rc), 0 0 10px var(--rc); } }
.slot .qty { position: absolute; right: 2px; bottom: 0; font-size: 11px; font-weight: 700; text-shadow: 1px 1px 0 #000, -1px 0 0 #000; font-variant-numeric: tabular-nums; pointer-events: none; }
.slot .up { position: absolute; left: 2px; top: 0; font-size: 10px; font-weight: 700; color: #ffb04a; text-shadow: 1px 1px 0 #000; pointer-events: none; }
.slot.sel { outline: 2px solid var(--brass); outline-offset: 1px; }
#tabs { display: flex; flex-wrap: wrap; gap: 2px; }
.tab { flex: 1 1 22%; padding: 5px 4px; background: #191424; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; box-shadow: inset 1px 1px 0 #2e2742, inset -1px -1px 0 var(--lo); }
.tab:hover { color: var(--text); }
.tab.on { background: var(--panel2); color: #ffd27a; box-shadow: inset 0 -2px 0 var(--brass), inset 1px 1px 0 var(--hi); }
#tabbody { padding: 4px 2px 12px; font-size: 13px; }
#tabbody h4 { font-family: var(--display); font-weight: 400; font-size: 20px; color: #ffd27a; margin: 12px 0 4px; letter-spacing: .02em; }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-bottom: 1px dashed #2a2338; }
.kv span { color: var(--muted); } .kv b { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
#tabbody .skill { display: grid; grid-template-columns: 1fr auto; padding: 3px 0; } #tabbody .skill span { color: var(--muted); } #tabbody .skill .bar { grid-column: 1 / 3; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
.resc { display: grid; grid-template-columns: 8px 1fr auto; gap: 6px; align-items: center; } .resc i { width: 8px; height: 8px; } .resc span { color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
.spell { display: grid; grid-template-columns: 32px 1fr; gap: 8px; padding: 6px; margin-bottom: 4px; background: #191424; cursor: grab; box-shadow: inset 1px 1px 0 #2e2742, inset -1px -1px 0 var(--lo); }
.spell img { width: 32px; height: 32px; } .spell b { display: block; } .spell small { color: var(--muted); display: block; } .spell em { color: #ffb04a; font-style: normal; display: block; font-size: 12px; } .spell p { margin: 2px 0 0; color: #d8d0c0; font-size: 12px; }
.spell.lock { opacity: .45; }
.spell:hover { background: #221c30; }
.quest { padding: 7px 8px; margin: 6px 0; background: #191424; box-shadow: inset 3px 0 0 #4a3f63; }
.quest.ready { box-shadow: inset 3px 0 0 var(--xp); background: #221d22; }
.quest b { color: #ffd27a; } .quest p { margin: 3px 0; color: #d8d0c0; } .quest small { color: var(--muted); display: block; margin-bottom: 4px; }
.best { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.bcard { background: #191424; padding: 4px; text-align: center; box-shadow: inset 1px 1px 0 #2e2742, inset -1px -1px 0 var(--lo); }
.bcard.boss { box-shadow: inset 0 0 0 1px #ff9d33; }
.bcard img { width: 48px; height: 48px; display: block; margin: 0 auto; } .bcard b { display: block; font-size: 11px; line-height: 1.15; } .bcard small { color: var(--muted); font-size: 10px; }
.opt { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
.opt input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--brass); }
.opt input[type=range] { flex: 1; accent-color: var(--brass); }
textarea { width: 100%; background: #0b0910; border: 0; padding: 6px; box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #2e2742; resize: vertical; font-size: 11px; -webkit-user-select: text; user-select: text; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
.col { display: grid; gap: 6px; }

/* botões */
.btn { padding: 6px 12px; background: #2e2640; border: 0; color: var(--text); cursor: pointer; box-shadow: inset 2px 2px 0 #4d4266, inset -2px -2px 0 #0c0a12; font-size: 14px; text-align: center; }
.btn:hover { background: #3a3150; }
.btn:active { box-shadow: inset 2px 2px 0 #0c0a12, inset -2px -2px 0 #4d4266; }
.btn.pri { background: #a8641e; color: #fff4dc; box-shadow: inset 2px 2px 0 #e8a94a, inset -2px -2px 0 #4a2808; }
.btn.pri:hover { background: #c0782a; }
.btn.danger { background: #6a1a22; box-shadow: inset 2px 2px 0 #a8343e, inset -2px -2px 0 #2a060a; }
.btn.on { background: var(--panel2); color: #ffd27a; box-shadow: inset 0 -2px 0 var(--brass); }
.btn.big { padding: 10px 18px; font-size: 18px; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .tab:focus-visible { outline: 2px solid var(--rune); outline-offset: 2px; }

/* barra de atalhos e console */
#dock { grid-column: 1; grid-row: 2; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 6px 8px; border-top: 2px solid var(--lo); }
#hotbar { display: grid; grid-template-columns: repeat(5, 46px); grid-auto-rows: 46px; gap: 4px; align-content: start; }
.hot { position: relative; width: 46px; height: 46px; background: #120f1a; box-shadow: inset 2px 2px 0 #06050a, inset -2px -2px 0 #2e2742; cursor: pointer; overflow: hidden; }
.hot img { position: absolute; left: 3px; top: 3px; width: 40px; height: 40px; pointer-events: none; }
.hot .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(8,6,12,.72); pointer-events: none; }
.hot .key { position: absolute; left: 3px; top: 1px; font-size: 11px; color: #ffd27a; text-shadow: 1px 1px 0 #000; pointer-events: none; }
.hot .hq { position: absolute; right: 3px; bottom: 1px; font-size: 11px; font-weight: 700; text-shadow: 1px 1px 0 #000; pointer-events: none; }
.hot.lock img, .hot.low img { filter: grayscale(.85) brightness(.6); }
.hot.lock .hq { color: #ff8a6a; }
.hot:hover { box-shadow: inset 2px 2px 0 #06050a, inset -2px -2px 0 #2e2742, inset 0 0 0 2px var(--brass); }
#console { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; height: 96px; background: #0e0b14; box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #2e2742; }
#log { overflow-y: auto; padding: 4px 8px; font-size: 13px; line-height: 1.3; scrollbar-width: thin; scrollbar-color: #3a3150 transparent; -webkit-user-select: text; user-select: text; }
.ll time { color: #5e5470; font-size: 11px; font-variant-numeric: tabular-nums; }
.ll { overflow-wrap: anywhere; }
.c-loot { color: #e8d8a8; } .c-lvl { color: #ffe066; } .c-quest { color: #ffb04a; } .c-skill { color: #9fe8ff; } .c-say { color: #f2e060; } .c-npc { color: #8fdcff; }
.c-peer { color: #b8d8ff; } .c-look { color: #d8d0c0; } .c-sys { color: #a8e0a8; } .c-err { color: #ff6a6a; } .c-party { color: #a8f0a0; }
#chatf { display: flex; border-top: 1px solid #241e30; }
#chat { flex: 1; min-width: 0; background: transparent; border: 0; padding: 5px 8px; font-size: 13px; -webkit-user-select: text; user-select: text; }
#chat::placeholder { color: #5e5470; }
#chatf button { background: #251f34; border: 0; padding: 0 12px; cursor: pointer; color: var(--muted); }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#buffs { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 45%; }
.buff { position: relative; width: 30px; height: 30px; background: #120f1a; box-shadow: 0 0 0 2px #08060c, inset 0 0 0 1px #4a3f63; pointer-events: auto; }
.buff.bad { box-shadow: 0 0 0 2px #08060c, inset 0 0 0 1px #d8383a; }
.buff img { width: 28px; height: 28px; margin: 1px; }
.buff span { position: absolute; right: -2px; bottom: -4px; font-size: 10px; font-weight: 700; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; }
#tframe { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 5px 10px 6px 6px; background: rgba(20,16,28,.88); box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo), 0 0 0 2px #08060c; }
#tframe img { width: 36px; height: 36px; }
.tinfo b { display: block; font-size: 14px; } .tinfo small { color: var(--muted); font-size: 11px; display: block; margin-bottom: 2px; }
#bossbar { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: min(520px, 70%); padding: 6px 12px 8px; background: rgba(28,10,14,.9); box-shadow: 0 0 0 2px #08060c, inset 0 0 0 1px #ff9d33; text-align: center; }
#bossbar .tinfo b { font-family: var(--display); font-weight: 400; font-size: 26px; color: #ffb04a; line-height: 1; }
#bossbar .bar.thp { width: 100%; height: 14px; } #bossbar .bar.thp span { line-height: 14px; font-size: 11px; }
#clock { position: absolute; right: 8px; top: 8px; padding: 3px 8px; font-size: 12px; background: rgba(15,12,22,.7); color: var(--muted); font-variant-numeric: tabular-nums; }
#banner { position: absolute; left: 0; right: 0; top: 20%; text-align: center; }
#banner b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(36px, 6vw, 64px); line-height: 1; color: #ffe9b8; text-shadow: 0 3px 0 #6e3c12, 0 0 24px rgba(0,0,0,.8); letter-spacing: .03em; }
#banner span { display: inline-block; margin-top: 6px; padding: 2px 12px; font-size: 15px; color: #d8c8a8; background: rgba(10,8,14,.6); }
#banner.show { animation: bnr 3.6s ease forwards; }
@keyframes bnr { 0% { opacity: 0; transform: translateY(-10px); } 12% { opacity: 1; transform: none; } 78% { opacity: 1; } 100% { opacity: 0; } }
#lvlup { position: absolute; left: 0; right: 0; top: 34%; text-align: center; }
#lvlup b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(56px, 9vw, 104px); line-height: 1; color: #ffe066; text-shadow: 0 4px 0 #b8741e, 0 8px 0 #4a2808, 0 0 40px rgba(255,200,60,.6); }
#lvlup span { color: #fff4dc; font-size: 16px; text-shadow: 1px 1px 0 #000; }
#lvlup.show { animation: lvl 3.2s ease forwards; }
@keyframes lvl { 0% { opacity: 0; transform: scale(.6); } 10% { opacity: 1; transform: scale(1.08); } 18% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
#notices { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.notice { padding: 3px 12px; font-size: 15px; font-weight: 600; text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000; transition: opacity .5s; max-width: 90%; text-align: center; }
.notice.out { opacity: 0; }
#sidebtn { display: none; position: absolute; right: 8px; top: 64px; z-index: 5; }
#sideclose { display: none; }
#cv:focus { outline: none; }

/* online */
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: #6a6478; box-shadow: 0 0 0 1px #08060c; vertical-align: 1px; }
.dot.on { background: #5ae07a; box-shadow: 0 0 0 1px #08060c, 0 0 6px #5ae07a; }
.dot.wait { background: #e8c040; }
#onlinebtn { position: absolute; right: 8px; top: 34px; pointer-events: auto; padding: 3px 9px; border: 0; font-size: 12px; color: var(--text); background: rgba(15,12,22,.8); box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo); cursor: pointer; font-variant-numeric: tabular-nums; }
#onlinebtn:hover { background: rgba(46,38,64,.95); }
#party { position: absolute; left: 8px; top: 46px; width: 184px; pointer-events: auto; padding: 5px 6px 6px; background: rgba(15,12,22,.8); box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo), 0 0 0 2px #08060c; }
#party[hidden], #kbdmsg[hidden] { display: none; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
.phead b { font-family: var(--display); font-weight: 400; font-size: 18px; line-height: 1; color: #a8f0a0; letter-spacing: .02em; }
.phead .mini { height: 18px; font-size: 11px; }
.pnone { font-size: 11px; color: var(--muted); }
.pmem { display: grid; grid-template-columns: 1fr auto; gap: 1px 6px; width: 100%; padding: 3px 2px; border: 0; background: transparent; color: var(--text); text-align: left; cursor: pointer; font-size: 12px; }
.pmem:hover { background: rgba(168,240,160,.08); }
.pmem .pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d8f8d0; }
.pmem small { color: var(--muted); font-size: 10px; }
.pbar { grid-column: 1 / 3; display: block; height: 5px; background: #0b0910; box-shadow: inset 0 0 0 1px #000; }
.pbar i { display: block; height: 100%; width: 100%; background: #38c838; transition: width .2s linear; }
#kbdmsg { position: absolute; left: 50%; top: 64%; transform: translateX(-50%); z-index: 9; pointer-events: none; padding: 7px 14px; font-size: 15px; font-weight: 600; color: #ffe9b8; background: rgba(20,16,28,.92); box-shadow: 0 0 0 2px #08060c, inset 0 0 0 1px var(--brass); white-space: nowrap; animation: kbd 1.6s ease-in-out infinite; }
@keyframes kbd { 50% { box-shadow: 0 0 0 2px #08060c, inset 0 0 0 1px var(--brass), 0 0 16px rgba(232,169,74,.55); } }
.netst { display: flex; align-items: center; gap: 2px; padding: 6px 8px; background: #191424; box-shadow: inset 1px 1px 0 #2e2742, inset -1px -1px 0 var(--lo); }
.prow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 6px; margin: 4px 0; background: #191424; }
.prow.party { box-shadow: inset 3px 0 0 #a8f0a0; }
.prow img { width: 34px; height: 40px; image-rendering: pixelated; }
.pinfo { min-width: 0; } .pinfo b { display: block; color: #b8d8ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .prow.party .pinfo b { color: #a8f0a0; }
.pinfo small { display: block; color: var(--muted); font-size: 11px; line-height: 1.25; }
.pacts { display: flex; flex-direction: column; gap: 3px; align-items: stretch; }
.pacts .btn { padding: 3px 8px; font-size: 12px; }
.ptag { font-size: 11px; color: #a8f0a0; text-align: center; padding: 2px 6px; box-shadow: inset 0 0 0 1px #3a6a3a; }
.ptag.wait { color: #e8c040; box-shadow: inset 0 0 0 1px #6a5a20; }
.prow img, .pinfo { cursor: pointer; }
.gpick { display: grid; grid-template-columns: repeat(auto-fill, 34px); gap: 3px; justify-content: center; margin: 8px 0; max-height: 230px; overflow-y: auto; }
.gpick .slot { border: 0; padding: 0; cursor: pointer; }

<script>
"use strict";

// ---- 00-util.js ----
// ============================================================
// QUADRIA — utilidades
// ============================================================
const TS = 16; // tamanho do tile em pixels de sprite
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, s, oct) {
  oct = oct || 3;
  let v = 0, amp = 0.5, f = 1, tot = 0;
  for (let i = 0; i < oct; i++) { v += vnoise(x * f, y * f, s + i * 17) * amp; tot += amp; amp *= 0.5; f *= 2; }
  return v / tot;
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rint = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rndf = (a, b) => a + Math.random() * (b - a);
const chance = (p) => Math.random() < p;
const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
const manh = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);

function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map((c) => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function shade(hex, amt) {
  const c = hexToRgb(hex);
  if (amt < 0) { const k = 1 + amt; return rgbToHex(c[0] * k, c[1] * k, c[2] * k); }
  return rgbToHex(c[0] + (255 - c[0]) * amt, c[1] + (255 - c[1]) * amt, c[2] + (255 - c[2]) * amt);
}
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
const isHex = (s) => typeof s === 'string' && /^#[0-9a-fA-F]{6}$/.test(s);

const $ = (sel) => document.querySelector(sel);
function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}
const fmt = (n) => Math.round(n).toLocaleString('pt-BR');

// direções: 0 baixo, 1 esquerda, 2 direita, 3 cima
const DIRS = [[0, 1], [-1, 0], [1, 0], [0, -1]];
function dirFromDelta(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) return dx < 0 ? 1 : 2;
  return dy < 0 ? 3 : 0;
}

// ---- 10-sprites.js ----
// ============================================================
// QUADRIA — sprites em pixel art gerados por código
// ============================================================
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function spr(w, h, draw) {
  const c = mkCanvas(w, h); const g = c.getContext('2d');
  const P = {
    g, w, h,
    r(x, y, w2, h2, col) { g.fillStyle = col; g.fillRect(x, y, w2, h2); return P; },
    p(x, y, col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); return P; },
    clr(x, y, w2, h2) { g.clearRect(x, y, w2, h2); return P; },
    diag(x, y, len, col, th) { th = th || 2; g.fillStyle = col; for (let i = 0; i < len; i++) g.fillRect(x + i, y - i, th, th); return P; },
  };
  draw(P);
  return c;
}
function flipH(c) {
  const o = mkCanvas(c.width, c.height); const g = o.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return o;
}
const INK = '#17121f';
function outline(c, col) {
  const w = c.width, h = c.height, g = c.getContext('2d');
  const img = g.getImageData(0, 0, w, h); const d = img.data;
  const rgb = hexToRgb(col || INK);
  const src = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) src[i] = d[i * 4 + 3] > 40 ? 1 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (src[i]) continue;
    if ((x > 0 && src[i - 1]) || (x < w - 1 && src[i + 1]) || (y > 0 && src[i - w]) || (y < h - 1 && src[i + w])) {
      d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2]; d[i * 4 + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

// TILES
// ------------------------------------------------------------
const T = {

function speck(P, r, base, cols, n) {
  P.r(0, 0, 16, 16, base);

function tufts(P, r, col, n) {
  for (let k = 0; k < n; k++) { const x = rint(r, 1, 12), y = rint(r, 3, 13); P.p(x, y, col); P.p(x + 1, y - 1, col); P.p(x + 2, y, col); }
}
function dt(id, name, mm, o) { TILE[id] = Object.assign({ id, name, mm, solid: false, liquid: false, wall: false, slow: 1, n: 3, anim: false }, o || {}); }

}

dt(T.VOID, 'Vazio', '#0b0a12', { solid: true, wall: true, n: 1, d(P) { P.r(0, 0, 16, 16, '#0b0a12'); } });
dt(T.SKY, 'Céu', '#1a1b3a', { solid: true, n: 4, d(P, r) {

} });
dt(T.GRASS, 'Grama', '#5a9e3e', { n: 4, d(P, r) { speck(P, r, '#5a9e3e', ['#66ab48', '#4f9136', '#62a544'], 36); tufts(P, r, '#3f7d2c', 3); } });

dt(T.SNOW, 'Neve', '#eef4f8', { n: 4, d(P, r) {

dt(T.DIRT, 'Estrada de terra', '#9c7648', { n: 4, d(P, r) {

function wallTop(P, r, t) {
  const cap = t.cap; P.r(0, 0, 16, 16, cap);
  const d = shade(cap, -0.12), l = shade(cap, 0.08);
  for (let i = 0; i < 16; i++) P.p(rint(r, 0, 15), rint(r, 0, 15), r() < 0.5 ? d : l);
  if (t.style === 'brick') { P.r(0, 7, 16, 1, d); P.r(0, 15, 16, 1, d); P.r(4, 0, 1, 7, d); P.r(11, 8, 1, 7, d); }
}
function wallFace(P, r, t) {
  const cap = t.cap, face = t.face, line = t.line;
  P.r(0, 0, 16, 6, cap);
  for (let i = 0; i < 5; i++) P.p(rint(r, 0, 15), rint(r, 0, 4), shade(cap, r() < 0.5 ? -0.1 : 0.08));
  P.r(0, 5, 16, 1, shade(cap, -0.3));
  P.r(0, 6, 16, 10, face);
  if (t.style === 'brick') {
    P.r(0, 6, 16, 1, shade(face, 0.14));
    P.r(0, 10, 16, 1, line); P.r(0, 15, 16, 1, shade(line, -0.25));
    P.r(5, 7, 1, 3, line); P.r(12, 7, 1, 3, line); P.r(1, 11, 1, 4, line); P.r(9, 11, 1, 4, line);
  } else if (t.style === 'plank') {
    for (const x of [3, 7, 11, 15]) P.r(x, 6, 1, 10, line);
    P.r(0, 6, 16, 1, shade(face, 0.12)); P.r(0, 15, 16, 1, shade(line, -0.25));
  } else {
    for (let i = 0; i < 12; i++) P.p(rint(r, 0, 15), rint(r, 7, 14), r() < 0.5 ? line : shade(face, 0.12));
    P.r(rint(r, 2, 6), 8, 1, 5, line); P.r(rint(r, 9, 13), 7, 1, 6, line);
    P.r(0, 15, 16, 1, shade(line, -0.3));
  }
}
function buildTiles() {
  for (const t of TILE) {
    if (!t) continue;
    if (t.wall && t.cap) {
      t.top = []; t.fc = [];
      for (let v = 0; v < t.n; v++) {
        const r1 = mulberry32(t.id * 131 + v * 7 + 1), r2 = mulberry32(t.id * 137 + v * 11 + 5);
        t.top.push(spr(16, 16, (P) => wallTop(P, r1, t)));
        t.fc.push(spr(16, 16, (P) => wallFace(P, r2, t)));
      }
    } else {
      t.spr = [];
      for (let v = 0; v < t.n; v++) { const r = mulberry32(t.id * 101 + v * 13 + 3); t.spr.push(spr(16, 16, (P) => t.d(P, r, v))); }
    }
  }
}

function buildObjects() {
  for (const o of OBJ) {
    if (!o) continue;
    o.spr = [];
    for (let v = 0; v < o.n; v++) {
      const c = spr(o.w, o.h, (P) => o.d(P, v));
      if (!o.decal) outline(c);
      o.spr.push(c);
    }
  }
}

const EYE = '#1b1420';
function drawWeaponSpr(P, w, hx, hy) {
  const col = w.col, light = shade(col, 0.35), wood = '#7a5230';
  switch (w.type) {
    case 'sword': P.r(hx, hy - 9, 2, 8, col); P.p(hx, hy - 10, col); P.r(hx, hy - 9, 1, 8, light); P.r(hx - 1, hy - 1, 4, 1, '#e2b04a'); P.r(hx, hy, 2, 2, wood); break;
    case 'axe': P.r(hx, hy - 9, 1, 12, wood); P.r(hx - 3, hy - 9, 3, 5, col); P.r(hx - 3, hy - 9, 1, 5, light); P.r(hx + 1, hy - 8, 1, 3, col); break;
    case 'mace': P.r(hx, hy - 7, 1, 10, wood); P.r(hx - 1, hy - 11, 3, 4, col); P.p(hx - 2, hy - 9, col); P.p(hx + 2, hy - 9, col); P.p(hx, hy - 12, col); P.p(hx - 1, hy - 11, light); break;
    case 'dagger': P.r(hx, hy - 5, 2, 4, col); P.p(hx, hy - 6, col); P.r(hx, hy - 5, 1, 4, light); P.r(hx - 1, hy - 1, 4, 1, '#3a2a1c'); P.r(hx, hy, 2, 1, wood); break;
    case 'spear': P.r(hx, hy - 12, 1, 16, wood); P.r(hx - 1, hy - 15, 3, 3, col); P.p(hx, hy - 16, light); break;
    case 'bow': P.p(hx + 1, hy - 8, col); P.r(hx, hy - 7, 1, 3, col); P.r(hx - 1, hy - 4, 1, 6, col); P.r(hx, hy + 2, 1, 3, col); P.p(hx + 1, hy + 5, col); P.r(hx + 2, hy - 7, 1, 12, '#e8e0d0'); break;
    case 'crossbow': P.r(hx, hy - 6, 2, 8, wood); P.r(hx - 3, hy - 6, 8, 1, col); P.p(hx - 3, hy - 5, col); P.p(hx + 4, hy - 5, col); P.r(hx, hy - 8, 1, 2, '#ddd'); break;
    case 'staff': P.r(hx, hy - 11, 1, 15, wood); P.r(hx - 1, hy - 14, 3, 3, col); P.p(hx, hy - 13, '#fff'); P.p(hx, hy - 15, light); break;
    case 'wand': P.r(hx, hy - 5, 1, 7, wood); P.p(hx, hy - 6, col); P.p(hx - 1, hy - 7, col); P.p(hx + 1, hy - 7, col); P.p(hx, hy - 8, '#fff'); break;
    default: break;
  }
}
function drawShieldSpr(P, col, sx, sy, book) {
  const l = shade(col, 0.3), d = shade(col, -0.3);
  if (book) { P.r(sx, sy, 5, 7, col); P.r(sx, sy, 1, 7, d); P.r(sx + 4, sy + 1, 1, 5, '#efe2c0'); P.r(sx + 1, sy + 2, 2, 2, l); P.p(sx + 2, sy + 3, '#ffe066'); return; }
  P.r(sx, sy, 6, 6, col); P.r(sx + 1, sy + 6, 4, 1, col); P.r(sx, sy, 6, 1, l); P.r(sx + 5, sy + 1, 1, 5, d); P.r(sx + 2, sy + 2, 2, 2, l);
}
function drawHair(P, style, col, dir) {
  const hl = shade(col, 0.25);
  const top = () => { P.r(6, 5, 12, 3, col); P.r(8, 5, 3, 1, hl); };
  if (style === 6) return;
  if (style === 3) { // moicano
    if (dir === 'u') P.r(10, 2, 4, 13, col); else if (dir === 'r') P.r(8, 2, 8, 5, col); else P.r(10, 2, 4, 6, col);
    P.p(11, 2, hl); return;
  }
  if (style === 5) { // tigela
    if (dir === 'u') P.r(5, 5, 14, 10, col); else if (dir === 'r') { P.r(5, 5, 14, 5, col); P.r(5, 10, 4, 3, col); } else P.r(5, 5, 14, 5, col);
    P.r(8, 5, 4, 1, hl); return;
  }
  top();
  if (dir === 'd') { P.r(6, 8, 3, 1, col); P.r(15, 8, 3, 1, col); P.r(5, 6, 1, 5, col); P.r(18, 6, 1, 5, col); }
  else if (dir === 'u') { P.r(5, 5, 14, 8, col); P.r(6, 13, 12, 1, col); }
  else { P.r(5, 6, 3, 8, col); P.r(15, 8, 3, 1, col); }
  if (style === 1) { // longo
    if (dir === 'd') { P.r(5, 6, 2, 13, col); P.r(17, 6, 2, 13, col); }
    else if (dir === 'u') P.r(5, 5, 14, 15, col);
    else P.r(4, 6, 4, 14, col);
  } else if (style === 2) { // espetado
    P.r(7, 3, 2, 2, col); P.r(11, 2, 2, 3, col); P.r(15, 3, 2, 2, col);
  } else if (style === 4) { // coque
    P.r(10, 2, 4, 3, col); P.p(11, 2, hl);
  }
}
function drawHelm(P, helm, dir) {
  const c = helm.col, l = shade(c, 0.3), d = shade(c, -0.3);
  if (helm.cls === 'h') {
    if (dir === 'u') { P.r(5, 4, 14, 12, c); P.r(5, 9, 14, 1, d); P.r(7, 5, 4, 1, l); }
    else if (dir === 'r') { P.r(5, 4, 14, 6, c); P.r(5, 10, 5, 5, c); P.r(5, 9, 14, 1, d); P.r(7, 5, 4, 1, l); }
    else { P.r(5, 4, 14, 6, c); P.r(7, 5, 4, 1, l); P.r(5, 9, 14, 1, d); P.r(5, 10, 2, 5, c); P.r(17, 10, 2, 5, c); P.r(11, 10, 2, 2, c); }
    if (helm.plume) { P.r(11, 1, 2, 3, helm.plume); P.r(12, 0, 3, 2, helm.plume); }
  } else if (helm.cls === 'm') {
    if (dir === 'u') { P.r(5, 4, 14, 13, c); P.r(10, 3, 4, 1, c); P.r(7, 15, 10, 1, d); }
    else if (dir === 'r') { P.r(5, 4, 14, 5, c); P.r(5, 9, 4, 8, c); P.r(10, 3, 4, 1, c); P.r(9, 8, 9, 1, d); }
    else { P.r(5, 4, 14, 5, c); P.r(5, 9, 2, 7, c); P.r(17, 9, 2, 7, c); P.r(10, 3, 4, 1, c); P.r(7, 8, 10, 1, d); }
    P.r(8, 5, 3, 1, l);

function beastSprites(spec) {
  const key = JSON.stringify(spec);
  let s = beastCache.get(key);
  if (s) return s;
  const fn = BEAST[spec.t];
  const a = outline(fn(spec, 0)), b = outline(fn(spec, 1));
  s = { r: [a, b], l: [flipH(a), flipH(b)], w: a.width, h: a.height, beast: true };
  beastCache.set(key, s);
  return s;
}

const EFX = {};
function mkEffect(name, n, fn) {
  EFX[name] = [];
  for (let f = 0; f < n; f++) {
    const r = mulberry32(hashStr(name) + f * 7919);
    EFX[name].push(spr(16, 16, (P) => fn(P, f, r, n)));
  }
}
function buildEffects() {
  mkEffect('fire', 6, (P, f, r) => {
    const H = [4, 8, 12, 13, 10, 5][f];
    for (let i = 0; i < 6; i++) {
      const x = 2 + i * 2, hh = Math.max(1, H - Math.round(Math.abs(i - 2.5) * 1.8) + rint(r, -1, 1));
      P.r(x, 15 - hh, 2, hh, '#d4421a');
      if (hh > 2) P.r(x, 17 - hh, 2, hh - 2, '#f58a23');
      if (hh > 5) P.r(x + (i % 2), 19 - hh, 1, hh - 5, '#ffe066');
    }
    if (f >= 3) for (let i = 0; i < f; i++) P.p(rint(r, 2, 13), rint(r, 0, 5), f > 4 ? '#5a524c' : '#ffb84a');
  });
  mkEffect('ice', 6, (P, f, r) => {
    const s = [2, 5, 7, 7, 6, 4][f];
    P.r(7, 8 - s, 2, s * 2, '#8fdcff'); P.r(8 - s, 7, s * 2, 2, '#bfeeff');
    for (let i = 0; i < s - 1; i++) { P.p(7 - i, 7 - i, '#dff6ff'); P.p(8 + i, 7 - i, '#dff6ff'); P.p(7 - i, 8 + i, '#dff6ff'); P.p(8 + i, 8 + i, '#dff6ff'); }
    P.r(7, 7, 2, 2, '#ffffff');
    if (f >= 3) for (let i = 0; i < 5; i++) P.p(rint(r, 0, 15), rint(r, 0, 15), '#ffffff');
  });
  mkEffect('energy', 5, (P, f, r) => {
    const cols = ['#b872ff', '#e6d6ff', '#ffffff'];
    for (let k = 0; k < 3; k++) {
      let x = rint(r, 3, 12), y = 0;
      while (y < 16) {
        const nx = clamp(x + rint(r, -3, 3), 1, 14);
        P.r(Math.min(x, nx), y, Math.abs(nx - x) + 1, 1, cols[k]);
        P.r(nx, y, 1, 3, cols[(k + 1) % 3]);
        x = nx; y += 3;
      }
    }
    if (f % 2 === 0) P.r(6, 6, 4, 4, '#ffffff');
  });
  mkEffect('earth', 6, (P, f, r) => {
    P.r(2, 13, 12, 2, f < 4 ? '#3f7d2c' : '#2f5f22');
    for (let i = 0; i < 7; i++) {
      const x = rint(r, 1, 12), y = 13 - f * 2 - rint(r, 0, 3), s = rint(r, 2, 3);
      if (y < 0) continue;
      P.r(x, y, s, s, i % 2 ? '#8fe05a' : '#4fa83a'); P.p(x, y, '#d8f8b0');
    }
  });
  mkEffect('holy', 6, (P, f, r) => {
    const s = [2, 4, 7, 7, 5, 3][f];
    P.r(7, 8 - s, 2, s * 2, '#fff7c8'); P.r(8 - s, 7, s * 2, 2, '#fff7c8');
    P.r(6, 6, 4, 4, '#ffe98a'); P.r(7, 7, 2, 2, '#ffffff');
    for (let i = 0; i < 6; i++) P.p(rint(r, 1, 14), rint(r, 1, 14), i % 2 ? '#ffe98a' : '#ffffff');
  });
  mkEffect('death', 6, (P, f) => {
    const rad = [7, 6, 5, 4, 3, 2][f];
    for (let a = 0; a < 16; a++) {
      const an = (a / 16) * Math.PI * 2 + f * 0.5;
      const x = Math.round(7 + Math.cos(an) * rad), y = Math.round(7 + Math.sin(an) * rad);
      P.r(x, y, 2, 2, a % 2 ? '#8a3aa8' : '#3a1a4a');
    }
    if (f >= 2 && f <= 4) {
      P.r(5, 4, 6, 5, '#e0d8e8'); P.r(6, 9, 4, 2, '#e0d8e8'); P.r(6, 6, 1, 2, '#2a1030'); P.r(9, 6, 1, 2, '#2a1030'); P.p(7, 10, '#2a1030'); P.p(8, 10, '#2a1030');
    }
  });
  mkEffect('blood', 5, (P, f, r) => {
    const s = [2, 3, 4, 4, 3][f];
    P.r(8 - s, 8 - Math.ceil(s / 2), s * 2, s, '#b0202a'); P.r(8 - Math.ceil(s / 2), 8 - s, s, s * 2, '#b0202a');
    for (let i = 0; i < 2 + f; i++) P.r(rint(r, 1, 13), rint(r, 1, 13), 2, 2, f > 3 ? '#701018' : '#e0323a');
  });
  mkEffect('slash', 4, (P, f) => {
    const off = f * 3;
    for (let i = 0; i < 12; i++) {
      const x = 2 + i, y = Math.round(13 - i - Math.sin((i / 11) * Math.PI) * 3);
      if (i < off + 5 && i >= off - 2) { P.r(x, y, 1, 2, '#ffffff'); P.p(x, y + 2, '#b8b8d0'); }
    }
  });
  mkEffect('heal', 6, (P, f, r) => {
    for (let i = 0; i < 7; i++) {
      const x = rint(r, 2, 13), y = 14 - f * 2 - rint(r, 0, 4);
      if (y < 1) continue;
      const c = i % 3 === 0 ? '#ffffff' : i % 3 === 1 ? '#7ff0c8' : '#5fd3ff';
      P.p(x, y, c);
      if (i % 2) { P.p(x - 1, y, c); P.p(x + 1, y, c); P.p(x, y - 1, c); P.p(x, y + 1, c); }
    }
  });
  mkEffect('poof', 6, (P, f) => {
    const s = Math.max(1, 4 - Math.floor(f / 2));
    for (let i = 0; i < 6; i++) {
      const an = (i / 6) * 6.28 + 0.4, d = f * 1.2;
      const x = Math.round(7 + Math.cos(an) * d), y = Math.round(7 + Math.sin(an) * d);
      P.r(x - 1, y - 1, s, s, f > 3 ? '#8a8d95' : '#d8dce4');
    }
  });
  mkEffect('quake', 5, (P, f, r) => {
    P.r(1, 12, 14, 1, '#4a311c'); P.r(4, 11, 1, 3, '#4a311c'); P.r(10, 10, 1, 4, '#4a311c');
    for (let i = 0; i < 7 - f; i++) { const x = rint(r, 1, 13), y = rint(r, 4, 12) - f; P.r(x, y, 2, 2, i % 2 ? '#a8825a' : '#6b4a2b'); }
  });
  mkEffect('arrows', 5, (P, f, r) => {
    for (let i = 0; i < 4; i++) { const x = 2 + i * 3 + rint(r, 0, 1), y = -6 + f * 4 + rint(r, 0, 2); P.r(x, y, 1, 5, '#e8e0d0'); P.p(x, y + 5, '#b8c2cc'); }
  });
  mkEffect('sparkle', 5, (P, f, r) => {
    for (let i = 0; i < 5; i++) {
      const x = rint(r, 2, 13), y = rint(r, 2, 13), c = i % 2 ? '#ffe066' : '#ffffff';
      P.p(x, y, c); if (f % 2 === 0) { P.p(x - 1, y, c); P.p(x + 1, y, c); P.p(x, y - 1, c); P.p(x, y + 1, c); }
    }
  });
  mkEffect('dust', 5, (P, f, r) => {
    for (let i = 0; i < 6; i++) { const x = rint(r, 2, 12), y = rint(r, 6, 13) - f; P.r(x, y, 2, 2, f > 2 ? '#8a8578' : '#c8bca0'); }
  });
  mkEffect('ecto', 5, (P, f, r) => {
    for (let i = 0; i < 6; i++) { const x = rint(r, 2, 12), y = rint(r, 5, 13) - f; P.r(x, y, 2, 2, i % 2 ? '#bfe8ff' : '#e8f8ff'); }
  });
}

// BORDAS ENTRE TERRENOS
// ------------------------------------------------------------
function buildEdges() {
  const pri = {};
  pri[T.DEEP] = 0; pri[T.WATER] = 1; pri[T.LAVA] = 1; pri[T.CAVE] = 2; pri[T.MUD] = 3; pri[T.DIRT] = 3; pri[T.SAND] = 4;
  pri[T.ASH] = 4; pri[T.HELL] = 4; pri[T.ICE] = 5; pri[T.SNOW] = 6; pri[T.CLOUD] = 6; pri[T.SWAMP] = 7; pri[T.AUTUMN] = 8;
  pri[T.GRASS] = 9; pri[T.DGRASS] = 10;
  for (const [t, v] of EXTRA_PRI) pri[t] = v;
  for (const k in pri) TILE[k].pri = pri[k];
  for (const k in pri) {
    const t = TILE[k];
    if (t.liquid) continue;
    t.edge = [];
    for (let side = 0; side < 4; side++) {
      const r = mulberry32(k * 53 + side * 7 + 11);
      const prof = []; let d = 3;
      for (let i = 0; i < 16; i++) { d = clamp(d + rint(r, -1, 1), 2, 4); prof.push(d); }
      const c = mkCanvas(16, 16), g = c.getContext('2d');
      g.drawImage(t.spr[0], 0, 0);
      const img = g.getImageData(0, 0, 16, 16), dd = img.data;
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        let depth, pos;
        if (side === 0) { depth = y; pos = x; } else if (side === 1) { depth = 15 - y; pos = x; } else if (side === 2) { depth = x; pos = y; } else { depth = 15 - x; pos = y; }
        const i4 = (y * 16 + x) * 4;
        if (depth >= prof[pos]) dd[i4 + 3] = 0;
        else if (depth === prof[pos] - 1) { dd[i4] *= 0.82; dd[i4 + 1] *= 0.82; dd[i4 + 2] *= 0.82; }
      }
      g.putImageData(img, 0, 0);
      t.edge.push(c);
    }
  }
}

const whiteCache = new WeakMap();
function whiteOf(c) {
  let w = whiteCache.get(c);
  if (w) return w;
  w = mkCanvas(c.width, c.height);
  const g = w.getContext('2d');
  g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
  whiteCache.set(c, w);
  return w;
}
const tintCache = new Map();
function tintOf(c, col, a) {
  let m = tintCache.get(col);
  if (!m) { m = new WeakMap(); tintCache.set(col, m); }
  let w = m.get(c);
  if (w) return w;
  w = mkCanvas(c.width, c.height);
  const g = w.getContext('2d');
  g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-atop'; g.globalAlpha = a || 0.45; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  m.set(c, w);
  return w;
}
function rot90(c) {
  const o = mkCanvas(c.height, c.width), g = o.getContext('2d');
  g.translate(o.width, 0); g.rotate(Math.PI / 2); g.drawImage(c, 0, 0);
  return o;
}
function darken(c, k) {
  const o = mkCanvas(c.width, c.height), g = o.getContext('2d');
  g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(20,12,24,' + k + ')'; g.fillRect(0, 0, c.width, c.height);
  return o;
}
function buildSprites2() { buildEffects(); buildEdges(); }

function M(id, name, lvl, look, o) {
  o = o || {};
  const s = mstat(lvl), boss = !!o.boss;
  const def = Object.assign({
    id, name, lvl, look, spd: 480, atkCd: 2000, range: 1, keep: 0, elem: 'phys', res: {}, loot: [], eq: 0.06, sc: 1, aggro: 7, blood: 'red', ab: [],
  }, o);
  def.hp = Math.round(s.hp * (o.hpM || (boss ? 7 : 1)));
  def.dmg = Math.round(s.dmg * (o.dmgM || (boss ? 1.3 : 1)));
  def.xp = Math.round(s.xp * (o.xpM || (boss ? 12 : 1)));
  const gm = o.gM || (boss ? 12 : 1);
  def.gold = [Math.round(lvl * 0.6 * gm), Math.round((lvl * 2.2 + 3) * gm)];
  if (boss) { def.eq = 1; def.aggro = 9; def.respawn = 240000; }
  MON[id] = def;
  return def;
}

Object.assign(ICON, {
  fsh(P, c, c2) {
    const d = shade(c, -0.28), l = shade(c, 0.3);
    P.r(3, 6, 8, 5, c); P.r(4, 5, 6, 1, c); P.r(4, 11, 6, 1, d); P.r(2, 7, 1, 3, c);
    P.r(11, 7, 1, 3, c); P.r(12, 5, 2, 3, c2); P.r(12, 9, 2, 3, c2); P.r(14, 4, 1, 2, c2); P.r(14, 10, 1, 2, c2);
    P.r(6, 3, 3, 2, c2); P.r(5, 6, 4, 1, l); P.p(4, 7, '#101018'); P.r(6, 9, 3, 1, c2);
  },
  fsl(P, c, c2) {
    const d = shade(c, -0.28);
    P.r(1, 7, 4, 3, c); P.r(5, 8, 4, 3, c); P.r(9, 7, 4, 3, c); P.r(13, 6, 2, 3, c);
    P.r(1, 9, 4, 1, d); P.r(9, 9, 4, 1, d); P.p(2, 7, '#101018');
    P.r(4, 6, 2, 1, c2); P.r(8, 7, 2, 1, c2); P.r(11, 6, 2, 1, c2); P.p(15, 5, c2); P.p(15, 9, c2);
  },
  fsr(P, c, c2) {

class MinHeap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(v, k) {
    const K = this.k, V = this.v; let i = K.length; K.push(k); V.push(v);
    while (i > 0) { const p = (i - 1) >> 1; if (K[p] <= k) break; K[i] = K[p]; V[i] = V[p]; i = p; }
    K[i] = k; V[i] = v;
  }
  pop() {
    const K = this.k, V = this.v, top = V[0], lk = K.pop(), lv = V.pop(), n = K.length;
    if (n > 0) {
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i, mk = lk;
        if (l < n && K[l] < mk) { m = l; mk = K[l]; }
        if (r < n && K[r] < mk) { m = r; mk = K[r]; }
        if (m === i) break;
        K[i] = K[m]; V[i] = V[m]; i = m;
      }
      K[i] = lk; V[i] = lv;
    }
    return top;
  }
}

class GameMap {
  constructor(id, name, w, h, o) {
    o = o || {};
    this.id = id; this.name = name; this.w = w; this.h = h;
    const n = w * h;
    this.t = new Uint8Array(n); this.v = new Uint8Array(n);
    this.o = new Uint8Array(n); this.ov = new Uint8Array(n);
    this.z = new Uint8Array(n); this.pz = new Uint8Array(n);
    this.occ = new Int32Array(n);
    this.explored = new Uint8Array(n);
    this.warps = new Map(); this.signs = new Map(); this.chests = new Map(); this.ways = new Map();
    this.anchors = {}; this.spawns = []; this.mons = []; this.npcs = []; this.ground = [];
    this.dark = o.dark || 0; this.daycycle = !!o.daycycle; this.tint = o.tint || null; this.sky = !!o.sky;
    this.seed = hashStr(id);
  }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  idx(x, y) { return y * this.w + x; }
  tile(x, y) { return this.inb(x, y) ? this.t[y * this.w + x] : T.VOID; }
  obj(x, y) { return this.inb(x, y) ? this.o[y * this.w + x] : 0; }
  setT(x, y, t) { if (!this.inb(x, y)) return; const i = y * this.w + x; this.t[i] = t; this.v[i] = (hash2(x, y, this.seed) * 251) | 0; }
  setO(x, y, o, v) { if (!this.inb(x, y)) return; const i = y * this.w + x; this.o[i] = o; this.ov[i] = v === undefined ? (hash2(x, y, this.seed + 7) * 251) | 0 : v; }
  blocked(x, y) {
    if (!this.inb(x, y)) return true;
    const i = y * this.w + x, t = TILE[this.t[i]];
    if (!t || t.solid) return true;
    const o = this.o[i];
    return !!(o && OBJ[o].solid);
  }
  free(x, y) { return !this.blocked(x, y) && !this.occ[y * this.w + x]; }
  wallAt(x, y) { const t = TILE[this.tile(x, y)]; return !!(t && t.wall); }
}

function astarGrid(W, H, sx, sy, tx, ty, cost) {

    const i = heap.pop();
    if (closed[i]) continue;
    closed[i] = 1;
    if (i === t) break;
    const x = i % W, y = (i / W) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = ny * W + nx;
      if (closed[j]) continue;
      const c = cost(nx, ny);
      if (c === Infinity) continue;
      const ng = g[i] + c;
      if (ng < g[j]) { g[j] = ng; from[j] = i; heap.push(j, ng + (Math.abs(nx - tx) + Math.abs(ny - ty)) * 0.9); }
    }
  }
  if (s !== t && from[t] < 0) return null;
  const path = []; let c = t;
  while (c !== -1 && c !== s) { path.push(c); c = from[c]; }
  path.push(s); path.reverse();
  return path;
}
// caminho em tempo de jogo (8 direções)

  while (heap.size && n < maxN) {

      if (ng < (g.get(j) === undefined ? Infinity : g.get(j))) {

// ajudantes de geração
// ------------------------------------------------------------
function zoneSpawns(m, R, prot) {
  for (let y = 1; y < m.h - 1; y++) for (let x = 1; x < m.w - 1; x++) {
    const i = y * m.w + x, Z = ZONES[m.z[i]];
    if (!Z || !Z.mons || m.blocked(x, y) || (prot && prot[i]) || m.pz[i]) continue;
    if (R() > Z.dens) continue;
    const tot = Z.mons.reduce((s, q) => s + q[1], 0);
    let r = R() * tot, mon = Z.mons[0][0];
    for (const [id, w] of Z.mons) { r -= w; if (r <= 0) { mon = id; break; } }
    m.spawns.push({ mon, x, y, n: 1 });
  }
}
function scatterDeco(m, R, prot, floors, list, dens) {
  const tot = list.reduce((s, q) => s + q[1], 0);
  for (let y = 2; y < m.h - 2; y++) for (let x = 2; x < m.w - 2; x++) {
    const i = m.idx(x, y);
    if (!floors.includes(m.t[i]) || m.o[i] || (prot && prot[i]) || m.pz[i]) continue;
    let open = 0;
    for (let j = -1; j <= 1; j++) for (let k = -1; k <= 1; k++) if (!m.blocked(x + k, y + j)) open++;
    if (open < 9 || R() > dens) continue;
    let r = R() * tot, o = list[0][0];
    for (const [ob, w] of list) { r -= w; if (r <= 0) { o = ob; break; } }
    m.setO(x, y, o, rint(R, 0, 250));
  }
}
function randomChests(m, R, prot, n, lv0, lv1) {
  for (let k = 0; k < 1500 && n > 0; k++) {
    const x = rint(R, 3, m.w - 4), y = rint(R, 3, m.h - 4), i = m.idx(x, y);
    if (m.blocked(x, y) || m.o[i] || (prot && prot[i]) || m.pz[i]) continue;
    let open = 0; for (const [dx, dy] of DIRS) if (!m.blocked(x + dx, y + dy)) open++;
    if (open < 3) continue;
    addChest(m, x, y, R() < 0.22 ? 'gold' : 'wood', rint(R, lv0, lv1)); protectAround(m, prot, x, y, 1); n--;
  }
}
function fillUnreached(m, from, t) {
  const d = bfsDist(m, from.x, from.y);
  for (let i = 0; i < d.length; i++) if (d[i] < 0 && !TILE[m.t[i]].solid) m.setT(i % m.w, (i / m.w) | 0, t);
  return d;
}
// segurança final: nenhum monstro nasce onde o jogador não chega
function pruneSpawns(m, from) {
  const d = bfsDist(m, from.x, from.y);
  const ok = (x, y) => { for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) if (m.inb(x + i, y + j) && d[m.idx(x + i, y + j)] >= 0) return true; return false; };
  m.spawns = m.spawns.filter((s) => (s.boss ? ok(s.x, s.y) : d[m.idx(s.x, s.y)] >= 0));
  for (const [i] of [...m.chests]) if (!ok(i % m.w, (i / m.w) | 0)) { m.chests.delete(i); m.setO(i % m.w, (i / m.w) | 0, 0); }
}
function setHub(m, way, temple, x, y, tx, ty, name) {
  m.setO(x, y, O.WAYSTONE); m.ways.set(m.idx(x, y), way);
  WAYSTONES[way].x = x; WAYSTONES[way].y = y + 1;
  if (temple) { TEMPLES[temple] = { m: m.id, x: tx, y: ty, n: name }; WAYSTONES[way].temple = temple; }
}

  m.anchors.hub = { x: 21, y: 25 };

function genDoce() {
  const W = 100, H = 100, R = mulberry32(5151);
  const m = new GameMap('doce', 'Dimensão Doce', W, H, { tint: 'rgba(255,150,200,0.05)' });
  const riverY = (x) => Math.round(H / 2 + Math.sin(x / 11) * 13 + Math.sin(x / 5.3) * 3);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = m.idx(x, y);
    m.setT(x, y, fbm(x * 0.06, y * 0.06, 51, 3) > 0.55 ? T.CREAM : T.CANDY);
    m.z[i] = x < 52 ? 31 : 32;
  }
  for (let x = 2; x < W - 2; x++) { const cy = riverY(x); for (let d = -1; d <= 1; d++) m.setT(x, cy + d, T.CHOCO); }
  const hub = { x: 15, y: 21 }, boss = { x: 85, y: 82 };
  for (let k = 0, n = 0; k < 60 && n < 6; k++) {
    const cx = rint(R, 10, W - 10), cy = rint(R, 10, H - 10);
    if (Math.hypot(cx - hub.x, cy - hub.y) < 18 || Math.hypot(cx - boss.x, cy - boss.y) < 14) continue;
    const r = 2.5 + R() * 3.5;
    circleDo(cx, cy, r + 2, (x, y, d) => { if (x > 2 && y > 2 && x < W - 3 && y < H - 3 && d + (hash2(x, y, 9) - 0.5) * 2.4 < r) m.setT(x, y, T.CHOCO); });
    n++;
  }
  const bridges = [];
  for (let x = 8; x < W - 8; x += 12) { const cy = riverY(x); for (let d = -3; d <= 3; d++) { m.setT(x, cy + d, T.CREAM); m.setT(x + 1, cy + d, T.CREAM); bridges.push([x, cy + d], [x + 1, cy + d]); } }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (x < 2 || y < 2 || x >= W - 2 || y >= H - 2) m.setT(x, y, T.W_CANDY);
  // Vila Confeitada
  const x0 = hub.x - 9, y0 = hub.y - 7, hw = 19, hh = 15;
  fillRect(m, x0, y0, hw, hh, T.CREAM);
  ringRect(m, x0, y0, hw, hh, T.W_CANDY);
  fillRect(m, hub.x - 1, y0 + hh - 1, 3, 1, T.CREAM); fillRect(m, x0 + hw - 1, hub.y - 1, 1, 3, T.CREAM);
  for (let y = y0 + 1; y < y0 + hh - 1; y++) for (let x = x0 + 1; x < x0 + hw - 1; x++) { const i = m.idx(x, y); m.pz[i] = 1; m.z[i] = 37; }
  fillRect(m, x0 + 12, y0 + 2, 5, 4, T.CHOCO); fillRect(m, x0 + 12, y0 + 6, 2, 1, T.DOCK);
  m.npcs.push({ id: 'dalva', x: x0 + 3, y: y0 + 3, town: 'doce' }, { id: 'fada', x: x0 + 3, y: y0 + 10, town: 'doce' }, { id: 'biscoito', x: x0 + 11, y: y0 + 6, town: 'doce' }, { id: 'guarda', x: hub.x + 2, y: y0 + hh - 2 });
  setHub(m, 'w_doce', 'doce', hub.x, hub.y + 2, hub.x, hub.y, 'Vila Confeitada');
  m.setO(x0 + 2, y0 + hh - 3, O.DEPOT); m.setO(x0 + 3, y0 + hh - 3, O.DEPOT);
  for (const [dx, dy, o] of [[6, 2, O.CUPCAKE], [8, 2, O.CUPCAKE], [16, 12, O.CUPCAKE], [1, 7, O.CANDYCANE], [17, 8, O.LOLLIPOP], [6, 12, O.GUMDROP], [10, 12, O.LOLLIPOP]]) m.setO(x0 + dx, y0 + dy, o, rint(R, 0, 250));
  m.anchors.hub = { x: hub.x, y: hub.y };
  // Castelo de Bolo (chefe)
  circleDo(boss.x, boss.y, 7, (x, y) => { if (x > 2 && y > 2 && x < W - 3 && y < H - 3) { m.setT(x, y, T.CREAM); m.setO(x, y, 0); } });
  for (let k = 0; k < 10; k++) { const a = k / 10 * 6.28; m.setO(Math.round(boss.x + Math.cos(a) * 6), Math.round(boss.y + Math.sin(a) * 6), k % 2 ? O.CANDYCANE : O.CUPCAKE, k); }
  m.spawns.push({ mon: 'rei_pudim', x: boss.x, y: boss.y, boss: true });
  addChest(m, boss.x, boss.y - 3, 'gold', 34);
  m.anchors.boss = boss;
  const prot = new Uint8Array(W * H);
  protectAround(m, prot, hub.x, hub.y, 11); protectAround(m, prot, boss.x, boss.y, 4);
  for (const [x, y] of bridges) protectAround(m, prot, x, y, 1);
  fillUnreached(m, hub, T.CHOCO);
  scatterDeco(m, R, prot, [T.CANDY, T.CREAM], [[O.LOLLIPOP, 5], [O.CANDYCANE, 3], [O.GUMDROP, 4], [O.CUPCAKE, 2], [O.FLOWER, 4]], 0.07);
  randomChests(m, R, prot, 6, 12, 32);
  zoneSpawns(m, R, prot);
  pruneSpawns(m, hub);
  return m;
}

  const D = { W: 110, H: 110, floor: T.CRYSF, wall: T.W_CRYS };
  const R = mulberry32(7373);
  const m = new GameMap('cristal', 'Dimensão Cristalina', D.W, D.H, { dark: 0.12, tint: 'rgba(160,120,255,0.06)' });
  for (let y = 0; y < D.H; y++) for (let x = 0; x < D.W; x++) m.z[m.idx(x, y)] = x < 55 ? 33 : 34;
  genCaveLayout(m, D, R);
  const e = { x: 13, y: 55 };
  fillRect(m, e.x - 9, e.y - 7, 18, 14, T.CRYSF);
  ringRect(m, e.x - 9, e.y - 7, 18, 14, T.W_CRYS);
  fillRect(m, e.x + 8, e.y - 1, 1, 3, T.CRYSF);
  { let run = 0;
    for (let x = e.x + 9; x < D.W - 3 && run < 3; x++) {
      let open = true;
      for (let y = e.y - 1; y <= e.y + 1; y++) if (TILE[m.tile(x, y)].solid) { m.setT(x, y, T.CRYSF); open = false; }
      run = open && x > e.x + 14 ? run + 1 : 0;
    } }
  for (let y = e.y - 6; y <= e.y + 5; y++) for (let x = e.x - 8; x <= e.x + 7; x++) { const i = m.idx(x, y); m.pz[i] = 1; m.z[i] = 38; }

  if (c === 'KeyR') { fishQuick(); e.preventDefault(); return; }
  if (c === 'Enter') { UI.focusChat(); e.preventDefault(); return; }

}

window.addEventListener('keyup', onKeyUp);

function useHot(n) {

// ---- 45-fishing.js ----
// ============================================================
// QUADRIA — pescaria no estilo Fisch:
// lançar (força), esperar a fisgada, sacudir, puxar na barra,
// raridades, mutações, peso, cesto, avaliação e Pescadex
// ============================================================
const FISHING = { st: null, ui: null, hold: false, lastCatch: null };

// ------------------------------------------------------------
// onde dá para pescar
// ------------------------------------------------------------
function fishPoolAt(m, x, y) {
  if (!m.inb(x, y)) return null;
  const i = m.idx(x, y), t = m.t[i];
  if (t === T.LAVA) return 'lava';
  if (t === T.CHOCO) return 'doce';
  if (t === T.PRISM) return 'cristal';
  if (t === T.STARSEA) return 'vazio';
  if (t === T.SKY) return m.id === 'ceu' ? 'ceu' : null;
  if (t === T.DEEP) return 'mar';
  if (t === T.ICE && m.z[i] === 6) return 'gelo';
  if (t === T.WATER) {
    if (m.id === 'praca') return 'praca';
    if (m.id !== 'ov') return 'lago';
    const z = m.z[i];
    if (z === 0) return 'mar';
    if (z === 4 || z === 21) return 'pantano';
    if (z === 5 || z === 23) return 'oasis';
    if (z === 6 || z === 22) return 'gelo';
    return 'lago';
  }
  return null;
}
function findCastTile(p, power) {
  const m = G.map, d = DIRS[p.dir] || DIRS[0];
  const want = 1 + Math.round((power === undefined ? 0.5 : power) * 3);
  for (let k = want; k >= 1; k--) { const x = p.x + d[0] * k, y = p.y + d[1] * k; if (fishPoolAt(m, x, y)) return { x, y }; }
  for (let k = want + 1; k <= 5; k++) { const x = p.x + d[0] * k, y = p.y + d[1] * k; if (fishPoolAt(m, x, y)) return { x, y }; }
  let best = null, bd = 1e9;
  for (let j = -4; j <= 4; j++) for (let i = -4; i <= 4; i++) {
    const x = p.x + i, y = p.y + j;
    if (!fishPoolAt(m, x, y)) continue;
    const dd = Math.abs(i) + Math.abs(j) + (i * d[0] + j * d[1] > 0 ? 0 : 1.5);
    if (dd < bd) { bd = dd; best = { x, y }; }
  }
  return best;
}
function isNightNow() {
  const m = G.map;
  if (!m) return false;
  if (!m.daycycle) return m.dark > 0.3;
  const h = (G.dayT * 24) % 24;
  return h >= 19 || h < 5;
}

// ------------------------------------------------------------
// atributos do pescador
// ------------------------------------------------------------
function fishLvl(p) { return (p.fishing && p.fishing.lvl) || 1; }
function fishNeed(L) { return Math.round(30 + L * L * 2.2 + L * 18); }
function rodOf(p, id) { return ROD[id] || ROD.vara_bambu; }
function currentBait(p) {
  if (p.bait && countItem(p, p.bait) > 0) return p.bait;
  return null;
}
function fishStats(p, rodId, pool, perfect) {
  const R = rodOf(p, rodId), L = fishLvl(p), bid = currentBait(p), B = bid ? BAIT[bid] : {};
  const baitOk = !B.pool || B.pool === pool;
  let luck = R.luck + (baitOk ? (B.luck || 0) : Math.round((B.luck || 0) * 0.3)) + L * 2 + (perfect ? 15 : 0) + (R.fav && R.fav === pool ? 40 : 0) + (p.buffs.luck > G.t ? 30 : 0);
  const lure = clamp(R.lure + (B.lure || 0) + Math.min(30, L * 0.5), -30, 85);
  const ctrl = clamp(R.ctrl + Math.min(0.08, L * 0.0025), 0.12, 0.5);
  const mut = R.mut + (B.mut || 0);

// ------------------------------------------------------------
// sorteio do peixe
// ------------------------------------------------------------
function fishCondOk(f, night) { return !f.cond || (f.cond === 'noite' ? night : !night); }
function rollFish(pool, st, night) {
  const list = (FISH_POOL[pool] || []).filter((f) => fishCondOk(f, night));
  if (!list.length) return null;
  const byR = {};
  for (const f of list) (byR[f.r] = byR[f.r] || []).push(f);
  let tot = 0;
  const ws = [];
  for (const r in byR) { const w = FRAR[r].w * Math.pow(1 + st.luck / 100, FRAR[r].k); ws.push([+r, w]); tot += w; }
  let q = Math.random() * tot, rr = ws[0][0];
  for (const [r, w] of ws) { q -= w; if (q <= 0) { rr = r; break; } }
  const f = choice(byR[rr]);
  if (f.special) return { s: f.id };
  const skew = Math.max(1, 2.2 - Math.min(1.2, st.luck / 250));
  let kg = f.kg[0] + (f.kg[1] - f.kg[0]) * Math.pow(Math.random(), skew);
  let g = 0;
  if (Math.random() < 0.015 + st.luck * 0.00004) { g = 1; kg *= rndf(1.5, 2.2); }
  kg = kg < 1 ? Math.round(kg * 100) / 100 : kg < 100 ? Math.round(kg * 10) / 10 : Math.round(kg);
  let m;
  const mc = Math.min(0.6, 0.06 + st.mut + st.luck * 0.0001);
  if (Math.random() < mc) {
    const opts = [];
    for (const k in MUTS) {
      const M2 = MUTS[k];
      if (M2.pools && !M2.pools.includes(pool)) continue;
      if (M2.night && !night) continue;
      opts.push([k, M2.w * (f.mutBias === k ? 6 : 1)]);
    }
    let t2 = opts.reduce((s, o) => s + o[1], 0), q2 = Math.random() * t2;
    for (const [k, w] of opts) { q2 -= w; if (q2 <= 0) { m = k; break; } }
  }
  const out = { s: f.id, kg };
  if (m) out.m = m;
  if (g) out.g = 1;
  return out;
}
function fishName(fi) {
  const f = FISH[fi.s];
  if (!f) return '?';
  return (fi.m && MUTS[fi.m] ? MUTS[fi.m].n + ' ' : '') + f.n + (fi.g ? ' (Gigante)' : '');
}
function fishValue(fi) {
  const f = FISH[fi.s];
  if (!f || !f.v) return 1;
  const avg = (f.kg[0] + f.kg[1]) / 2;
  const v = f.v * Math.pow(Math.max(0.01, fi.kg) / avg, 0.85) * (fi.m && MUTS[fi.m] ? MUTS[fi.m].mult : 1) * (fi.g ? 1.25 : 1);
  return Math.max(1, Math.round(v));
}
function fishKgTxt(kg) { return (kg < 10 ? kg.toFixed(2).replace(/0$/, '') : kg < 100 ? kg.toFixed(1) : fmt(kg)).replace('.', ',') + ' kg'; }
function fishURL(fi) { const f = FISH[fi.s]; return iconURLFor(f ? f.icon : ['fsh', '#8a8d95', '#5a5d65']); }

// ------------------------------------------------------------
// estado da pescaria
// ------------------------------------------------------------
function fishUseRod(rodId) {
  const p = G.p, F = FISHING.st;
  if (F) { fishAction(); return; }
  if (p.dead) return;
  if (!p.fishing) p.fishing = { lvl: 1, xp: 0 };
  if (!p.fish) p.fish = [];
  if (G.t - p.lastCombat < 2500) return notice('Saia do combate antes de pescar.', '#ff8a6a');
  if (p.fish.length >= (p.fishCap || FISH_CAP0)) return notice('Seu cesto está cheio! Venda peixes para um pescador.', '#ff8a6a');
  const tile = findCastTile(p);
  if (!tile) return notice('Chegue perto da água para pescar (lago, rio, mar, lava, nuvens...).', '#c8b8a0');
  const pool = fishPoolAt(G.map, tile.x, tile.y);
  if (pool === 'lava' && !rodOf(p, rodId).lava) return notice('Só varas resistentes ao fogo pescam na lava (Abissal, do Vazio ou Tridente).', '#ff8a6a');
  faceTo(p, tile);
  p.path = null; p.pending = null; NET.follow = null;
  setTarget(null);
  FISHING.st = { phase: 'cast', rod: rodId, t0: G.t, power: 0, px: p.x, py: p.y, map: G.map.id };
  FISHING.hold = false;
  fishUI().show('cast');
  sfx('click');
}
function fishAction() {
  const F = FISHING.st;
  if (!F) return false;
  if (F.phase === 'cast') { fishCast(); return true; }
  if (F.phase === 'wait' || F.phase === 'fly') {
    if (G.t - (FISHING.hintT || 0) > 1500) { FISHING.hintT = G.t; notice('Espere o peixe morder... (ande ou Esc para recolher a linha)', '#8fdcff'); }
    return true;
  }
  if (F.phase === 'shake') { fishShake(); return true; }
  if (F.phase === 'done') {
    // de novo! lança outra vez com a mesma vara
    const rod = F.rod;
    FISHING.st = null; fishUI().hide(); netFishState();
    if (countItem(G.p, rod) > 0) fishUseRod(rod);
    return true;
  }
  return F.phase === 'reel' || F.phase === 'fly';
}
// varas na mochila e a melhor para o lugar
function fishRods(p) { const out = []; for (const it of p.bag) if (it && ROD[it.b] && !out.includes(it.b)) out.push(it.b); return out; }
function fishBestRod(p, pool) {
  let best = null, bs = -1;
  for (const id of fishRods(p)) {
    const R = ROD[id];
    if (pool === 'lava' && !R.lava) continue;
    const sc = R.luck + (R.fav && R.fav === pool ? 40 : 0) + R.ctrl * 100 + R.res * 0.3;
    if (sc > bs) { bs = sc; best = id; }
  }
  return best;
}
// tecla R ou clique na água: pesca com a melhor vara da mochila
function fishQuick(tile) {
  const p = G.p;
  if (!p || p.dead) return false;
  if (FISHING.st) { fishAction(); return true; }
  const rods = fishRods(p);
  if (!rods.length) { notice('Você precisa de uma vara de pesca. Os pescadores vendem: Praça das Trocas, Vila do Brejo e Oásis.', '#c8b8a0'); return false; }
  if (tile) faceTo(p, tile);
  const t = findCastTile(p);
  if (t) faceTo(p, t);
  const pool = t ? fishPoolAt(G.map, t.x, t.y) : null;
  fishUseRod(fishBestRod(p, pool) || rods[0]);
  return true;
}
function castPower(F) { const k = ((G.t - F.t0) / 1300) % 2; return k < 1 ? k : 2 - k; }
function fishCast() {
  const p = G.p, F = FISHING.st;
  const power = castPower(F);
  const tile = findCastTile(p, power);
  if (!tile) { fishCancel('Não há água por perto.'); return; }
  const pool = fishPoolAt(G.map, tile.x, tile.y);
  const perfect = power >= 0.88;
  const bid = currentBait(p);
  if (bid) { removeItem(p, bid, 1); G.dirty.bag = 1; G.dirty.hot = 1; }
  const st = fishStats(p, F.rod, pool, perfect);
  st.bait = bid;
  Object.assign(F, { phase: 'fly', power, perfect, tx: tile.x, ty: tile.y, pool, st, flyT: G.t });
  const wait = rndf(3.5, 9) * (1 - st.lure / 100 * 0.65) * (perfect ? 0.75 : 1);
  F.biteAt = G.t + 450 + Math.max(1200, wait * 1000);
  if (perfect) floatText(p, 'Perfeito!', '#6ff0ff', 1.05, 1);
  sfx('bow', 0.6);
  fishUI().show('wait');
  netFishState();
}
function fishCancel(msg) {
  if (!FISHING.st) return;
  FISHING.st = null; FISHING.hold = false;
  fishUI().hide();
  if (msg) notice(msg, '#c8b8a0');
  netFishState();
}
function fishBite() {
  const F = FISHING.st, p = G.p;
  const fi = rollFish(F.pool, F.st, isNightNow());
  if (!fi) { fishCancel('Nada mordeu a isca.'); return; }
  F.fish = fi;
  const r = FISH[fi.s].r;
  F.phase = 'shake';
  F.shakes = FRAR[r].shakes;
  F.shakeT = G.t + 2400;
  addFx(F.tx, F.ty, 'ecto');
  floatText(p, '!', '#ffe066', 1.6, 1);
  sfx('hit', 0.7);
  fishUI().show('shake');
  netFishState();
}
function fishShake() {
  const F = FISHING.st;
  F.shakes--;
  F.shakeT = G.t + 2200;
  addFx(F.tx, F.ty, 'ecto');
  sfx('swing', 0.8);
  if (F.shakes <= 0) fishStartReel();
  else fishUI().moveShake();
}
function fishStartReel() {
  const F = FISHING.st, f = FISH[F.fish.s];
  const diff = clamp(FRAR[f.r].diff + (f.beh === 'veloz' ? 0.08 : 0) + (F.fish.m ? 0.04 : 0) + (F.fish.g ? 0.05 : 0), 0.1, 0.98);
  const bw = clamp(F.st.ctrl - diff * 0.06, 0.12, 0.5);
  // peixe pesado para a espécie (ou gigante) demora mais para subir
  const rel = clamp((F.fish.kg - f.kg[0]) / Math.max(0.0001, f.kg[1] - f.kg[0]), 0, 1);
  const gain = 0.3 * (1 - diff * 0.5) * (1 - rel * 0.18) * (F.fish.g ? 0.82 : 1);
  F.phase = 'reel';
  F.reel = { diff, bw, gain, bx: 0.5 - bw / 2, bv: 0, fx: 0.5, ftar: rndf(0.1, 0.9), fnext: G.t + 800, jump: 0, dash: 0, prog: 0.22, beh: f.beh || '' };
  FISHING.hold = false;
  fishUI().show('reel');
  sfx('click');
}
function fishTick(dt) {
  const F = FISHING.st, p = G.p;
  if (!F) return;
  if (p.dead || F.map !== G.map.id) { fishCancel(); return; }
  if (F.phase !== 'done' && (p.x !== F.px || p.y !== F.py)) { fishCancel('Você recolheu a linha.'); return; }
  if (F.phase !== 'done' && countItem(p, F.rod) <= 0) { fishCancel('Você ficou sem a vara.'); return; }
  const s = dt / 1000;
  if (F.phase === 'cast') {
    fishUI().cast(castPower(F));
    if (G.t - F.t0 > 9000) fishCast();
  } else if (F.phase === 'fly') {
    if (G.t - F.flyT > 450) { F.phase = 'wait'; addFx(F.tx, F.ty, 'ecto'); sfx('potion', 0.4); }
  } else if (F.phase === 'wait') {
    fishUI().wait(clamp(1 - (F.biteAt - G.t) / 9000, 0, 1));
    if (Math.random() < s * 0.6) addFx(F.tx, F.ty, 'ecto');
    if (G.t >= F.biteAt) fishBite();
  } else if (F.phase === 'shake') {
    if (G.t > F.shakeT) { fishLose('O peixe soltou a isca!'); return; }
    fishUI().shakeTimer(clamp((F.shakeT - G.t) / 2200, 0, 1));
  } else if (F.phase === 'reel') {
    const R = F.reel, hold = FISHING.hold;
    // barra do jogador: segurar puxa para a direita, soltar cai para a esquerda
    R.bv += (hold ? 2.7 : -2.5) * s;
    R.bv *= Math.pow(0.35, s);
    R.bx += R.bv * s;
    if (R.bx < 0) { R.bx = 0; R.bv = Math.abs(R.bv) * 0.25; }
    if (R.bx > 1 - R.bw) { R.bx = 1 - R.bw; R.bv = -Math.abs(R.bv) * 0.25; }
    // peixe
    if (G.t >= R.fnext) {
      const ag = R.beh === 'agitado' ? 0.55 : R.beh === 'pesado' ? 1.4 : 1;
      // peixes raros dão arrancadas para o outro lado da trilha
      const far = R.diff > 0.55 && Math.random() < (R.diff - 0.45) * 0.6;
      R.ftar = far ? (R.fx < 0.5 ? rndf(0.7, 0.97) : rndf(0.03, 0.3)) : clamp(R.fx + rndf(-0.6, 0.6) * (0.4 + R.diff), 0.03, 0.97);
      R.dash = far ? G.t + 380 : 0;
      R.fnext = G.t + rndf(450, 1500) * ag * (1.15 - R.diff * 0.5);
      if (R.beh === 'saltador' && Math.random() < 0.35) R.jump = G.t + 160;
    }
    const spd = (0.18 + R.diff * 0.85) * (R.beh === 'veloz' ? 1.35 : R.beh === 'pesado' ? 0.75 : 1) * (G.t < R.jump ? 4 : 1) * (G.t < R.dash ? 2.2 : 1);
    const dx = R.ftar - R.fx;
    R.fx += clamp(dx, -spd * s, spd * s) + Math.sin(G.t / 90) * 0.0015 * R.diff;
    R.fx = clamp(R.fx, 0, 1);
    const inBar = R.fx >= R.bx && R.fx <= R.bx + R.bw;
    if (inBar) R.prog += R.gain * (1 + fishLvl(p) * 0.004) * s;
    else R.prog -= (0.18 + R.diff * 0.32) * (1 - F.st.res / 100) * (R.beh === 'pesado' ? 1.2 : 1) * s;
    if (Math.random() < s * (inBar ? 4 : 1.5)) sfx(inBar ? 'click' : 'block', 0.12);
    fishUI().reel(R, inBar);
    if (R.prog >= 1) fishCatch();
    else if (R.prog <= 0) fishLose('A linha arrebentou! O peixe escapou.');
  } else if (F.phase === 'done') {
    if (G.t - F.doneT > 3200) { FISHING.st = null; fishUI().hide(); netFishState(); }
  }
}
function fishLose(msg) {
  const F = FISHING.st;
  if (F && F.fish) addFx(F.tx, F.ty, 'poof');

function fishKey(e, down, c) {

    if (F.phase === 'reel') { FISHING.hold = down; e.preventDefault(); return true; }
    if (down && !e.repeat) { fishAction(); e.preventDefault(); return true; }
    e.preventDefault();
    return true;
  }
  if (down && c === 'Escape' && F.phase !== 'done') { fishCancel('Você recolheu a linha.'); e.preventDefault(); return true; }

function drawFishLine(g, ax, ay, face, tx, ty, phase, t0, camPX, camPY, S, now, col) {
  const hx = (ax * 16 + 8 + face * 5), hy = ay * 16 + 6;
  const rx = hx + face * 8, ry = hy - 12;
  let bx = tx * 16 + 8, by = ty * 16 + 9 + Math.sin(now / 260) * 1.2;
  if (phase === 'fly') { const k = clamp((G.t - t0) / 450, 0, 1); bx = lerp(rx, bx, k); by = lerp(ry, by, k) - Math.sin(k * Math.PI) * 18; }
  if (phase === 'shake' || phase === 'bite') by += 2 + Math.sin(now / 40) * 1.5;
  g.strokeStyle = '#6b4a2b'; g.lineWidth = Math.max(1, S * 0.8);
  g.beginPath(); g.moveTo((hx - camPX) * S, (hy - camPY) * S); g.lineTo((rx - camPX) * S, (ry - camPY) * S); g.stroke();
  g.strokeStyle = col || 'rgba(240,240,255,0.75)'; g.lineWidth = Math.max(1, S * 0.35);
  g.beginPath(); g.moveTo((rx - camPX) * S, (ry - camPY) * S);
  g.quadraticCurveTo(((rx + bx) / 2 - camPX) * S, ((Math.max(ry, by) + 6) - camPY) * S, (bx - camPX) * S, (by - camPY) * S); g.stroke();
  if (phase === 'reel') return;
  g.fillStyle = '#ffffff'; g.fillRect(Math.round(bx - 1.5 - camPX) * S, Math.round(by - camPY) * S, 3 * S, 2 * S);
  g.fillStyle = '#e2304a'; g.fillRect(Math.round(bx - 1.5 - camPX) * S, Math.round(by - 2 - camPY) * S, 3 * S, 2 * S);
  if (phase === 'wait' && Math.floor(now / 500) % 3 === 0) { g.strokeStyle = 'rgba(220,240,255,0.45)'; g.lineWidth = Math.max(1, S * 0.5); g.strokeRect((bx - 4 - camPX) * S, (by + 1 - camPY) * S, 8 * S, 2 * S); }
}
function drawFishing(g, camPX, camPY, S, now) {
  const F = FISHING.st, p = G.p;
  if (F && p && F.tx !== undefined && F.phase !== 'done' && F.phase !== 'cast') drawFishLine(g, p.rx, p.ry, p.face, F.tx, F.ty, F.phase, F.flyT, camPX, camPY, S, now);

  }
}

function pickActor(wx, wy) {
  const m = G.map;
  let best = null, bd = 0.85;
  const test = (a) => {
    if (a.dead) return;
    const sc = a.def && a.def.sc ? a.def.sc : 1;
    const dx = wx - (a.rx + 0.5), dy = wy - (a.ry + 0.5);
    const d = Math.hypot(dx, dy > 0 ? dy : dy / (sc > 1 ? 2.2 : 1.4));
    if (d < bd) { bd = d; best = a; }
  };
  for (const a of m.mons) test(a);
  for (const a of m.npcActs) test(a);
  for (const a of G.peers.values()) if (a.map === m.id) test(a);
  return best;
}
function walkTo(tx, ty) {
  const p = G.p, m = G.map;
  if (p.dead) return;
  if (!m.inb(tx, ty)) return;
  p.pending = null; NET.follow = null;
  let path = findPath(m, p.x, p.y, tx, ty, 6000, { partial: true });
  if (path && path.length) { p.path = path; G.clickFx = { x: tx, y: ty, t0: G.t }; }
}

function initTouch() {

    G.touchDir = map[oct] || null;

  pad.addEventListener('pointermove', move);
  const up = () => { id = null; G.touchDir = null; knob.style.transform = ''; };
  pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
